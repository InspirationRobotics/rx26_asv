name: ci
on:
  push:
  pull_request:

jobs:
  # The orchestrator job (unit+episode tests, G0 smoke, gates G3/G4/G5) lives on
  # the `sim/orchestrator` branch along with the harness itself — see
  # docs/PARKED_SIM.md. Restore it here when that branch is merged back.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest numpy pyyaml
      - name: unit tests
        run: python -m pytest tests -q

  interfaces:
    name: colcon build (ros:humble)
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: build interfaces + rx26_asv packages
        shell: bash
        run: |
          # Reproduce the Jetson's workspace SHAPE: the repo is one source dir
          # inside a colcon workspace, not the workspace root. That nesting is
          # what the discovery guard below actually tests. The path matches the
          # boat for readability; colcon does not care what it is called.
          mkdir -p /root/robotx_ws/src
          cp -r . /root/robotx_ws/src/rx26_asv
          cd /root/robotx_ws
          source /opt/ros/humble/setup.bash

          # Guard the failure mode this layout exists to prevent: if the repo
          # root ever becomes a package again, colcon stops descending and
          # `interfaces` is silently skipped. Fail loudly instead.
          colcon list --names-only | sort > /tmp/pkgs.txt
          echo "discovered packages:"; cat /tmp/pkgs.txt
          for p in interfaces rx26_asv; do
            grep -qx "$p" /tmp/pkgs.txt || {
              echo "ERROR: colcon did not discover package '$p'" >&2; exit 1; }
          done

          colcon build --packages-select interfaces rx26_asv \
                       --event-handlers console_cohesion+

  tools-lint:
    name: tools syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python compile + shell -n
        run: |
          python3 -m py_compile tools/scripts/*.py tools/sim/*.py \
                                tools/training/*.py tools/bench/*.py \
                                tools/udev/*.py
          # Every tracked shell script, so a new one is covered the day it lands
          # rather than the day someone remembers to add it here. setup/*.sh in
          # particular was uncovered: it carries the repo-vs-workspace path
          # derivation and the "not a colcon workspace" guard.
          fail=0
          for f in $(git ls-files '*.sh'); do
            echo "  bash -n $f"
            bash -n "$f" || { echo "SYNTAX FAIL: $f" >&2; fail=1; }
          done
          exit $fail
