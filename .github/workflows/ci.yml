name: ci
on:
  push:
  pull_request:

jobs:
  # The orchestrator job (unit+episode tests, G0 smoke, gates G3/G4/G5) lives on
  # the `sim/orchestrator` branch along with the harness itself — see
  # docs/PARKED_SIM.md. Restore it here when that branch is merged back.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest numpy pyyaml
      - name: unit tests
        run: python -m pytest tests -q

  interfaces:
    name: colcon build (ros:humble)
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: build interfaces + robotx_2026 packages
        shell: bash
        run: |
          mkdir -p /ws/src
          # interfaces copied out separately: the repo root is itself the
          # robotx_2026 package, and colcon does not descend into packages
          cp -r interfaces /ws/src/
          cp -r . /ws/src/robotx_2026_pkg
          cd /ws
          source /opt/ros/humble/setup.bash
          colcon build --packages-select interfaces robotx_2026 \
                       --event-handlers console_cohesion+

  tools-lint:
    name: tools syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python compile + shell -n
        run: |
          python3 -m py_compile tools/scripts/*.py tools/sim/*.py \
                                tools/training/*.py tools/bench/*.py \
                                tools/udev/*.py
          bash -n tools/udev/install_udev.sh tools/scripts/rebuild.sh
