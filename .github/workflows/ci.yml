name: ci
on:
  push:
  pull_request:

jobs:
  # The orchestrator job (unit+episode tests, G0 smoke, gates G3/G4/G5) lives on
  # the `sim/orchestrator` branch along with the harness itself — see
  # docs/PARKED_SIM.md. Restore it here when that branch is merged back.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest numpy pyyaml
      - name: unit tests
        run: python -m pytest tests -q

  interfaces:
    name: colcon build (ros:humble)
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: build interfaces + rx26_asv packages
        shell: bash
        run: |
          # Mirror the Jetson layout exactly: the repo is ONE source dir inside
          # a colcon workspace, not the workspace root.
          mkdir -p /ws/src
          cp -r . /ws/src/rx26_asv
          cd /ws
          source /opt/ros/humble/setup.bash

          # Guard the failure mode this layout exists to prevent: if the repo
          # root ever becomes a package again, colcon stops descending and
          # `interfaces` is silently skipped. Fail loudly instead.
          colcon list --names-only | sort > /tmp/pkgs.txt
          echo "discovered packages:"; cat /tmp/pkgs.txt
          for p in interfaces rx26_asv; do
            grep -qx "$p" /tmp/pkgs.txt || {
              echo "ERROR: colcon did not discover package '$p'" >&2; exit 1; }
          done

          colcon build --packages-select interfaces rx26_asv \
                       --event-handlers console_cohesion+

  tools-lint:
    name: tools syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python compile + shell -n
        run: |
          python3 -m py_compile tools/scripts/*.py tools/sim/*.py \
                                tools/training/*.py tools/bench/*.py \
                                tools/udev/*.py
          bash -n tools/udev/install_udev.sh tools/scripts/rebuild.sh
