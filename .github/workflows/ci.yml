name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    name: config, syntax, header-only C++ tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      # The params YAML (rcl-legal, every key declared by its node with its type), the
      # cross-checks between it, nav2_params.yaml and the autopilot baseline, the package
      # manifests and the tree XML. No ROS.
      - name: check_config
        run: python3 tools/scripts/check_config.py
      - name: python compile, shell syntax, executable bits
        shell: bash
        run: |
          python3 -m py_compile $(git ls-files 'tools/*.py')
          fail=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "SYNTAX FAIL: $f" >&2; fail=1; }
          done
          # Checked in the INDEX: a Windows checkout commits a script 100644 unnoticed,
          # and systemd then refuses ExecStart=start_mavproxy.sh on the Jetson.
          while read -r mode _ _ path; do
            [ "$mode" = 100755 ] || { echo "NOT EXECUTABLE ($mode): $path" >&2; fail=1; }
          done < <(git ls-files -s '*.sh')
          exit $fail
      # The image is arm64 and cannot be built here; a COPY of a moved file can be caught.
      - name: Dockerfile COPY sources exist
        run: |
          python3 - <<'PY'
          import os, sys
          bad = []
          for n, line in enumerate(open("Dockerfile"), 1):
              words = line.split()
              if not words or words[0].upper() != "COPY" or any(w.startswith("--from") for w in words):
                  continue
              srcs = [w for w in words[1:] if not w.startswith("--")][:-1]
              bad += [(n, s) for s in srcs if "$" not in s and "*" not in s and not os.path.exists(s)]
          for n, s in bad:
              print(f"Dockerfile:{n}: COPY source does not exist: {s}")
          sys.exit(1 if bad else 0)
          PY
      # The maths the trees drive, dock, aim and plan by: stdlib-only headers.
      - name: header-only C++ tests
        run: |
          for t in nav_math dock_math fire_math path_math side_fences global_passage \
                   planned_leg nav_params run_start; do
            echo "== $t"
            g++ -std=c++17 -O2 -Wall -Wextra -I crusader_bt/include \
                -o "/tmp/$t" "crusader_bt/test/test_$t.cpp" && "/tmp/$t" || exit 1
          done
          g++ -std=c++17 -O2 -Wall -Wextra -I crusader_nav_layers/include \
              -o /tmp/raster crusader_nav_layers/test/test_raster.cpp && /tmp/raster

  build-test:
    name: colcon build + tests (ros:humble)
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: build, entry points, tests
        shell: bash
        run: |
          # The Jetson's workspace SHAPE: the repo is one source dir inside a colcon
          # workspace. If the repo root ever became a package, colcon would stop
          # descending and skip every package below it without a word.
          mkdir -p /root/robotx_ws/src
          cp -r . /root/robotx_ws/src/rx26_asv
          cd /root/robotx_ws
          source /opt/ros/humble/setup.bash

          apt-get update -qq
          apt-get install -y -qq python3-pip > /dev/null
          rosdep update --rosdistro humble > /dev/null
          rosdep install -y -q --rosdistro humble --ignore-src --from-paths src/rx26_asv/crusader_*
          pip3 install -q pymavlink pytest

          # --packages-up-to bringup proves the dependency graph: a package missing from
          # bringup's closure is not built, and the entry-point check below fails.
          colcon build --packages-up-to crusader_bringup --event-handlers console_cohesion+
          source install/setup.bash

          # Every console script must import: one pointing at a moved module builds clean
          # and dies at `ros2 run`, on the boat.
          python3 src/rx26_asv/tools/scripts/check_entry_points.py

          # The C++ tests, and every built-in tree loading through bt_tree_check.
          colcon test --packages-select crusader_bt crusader_nav_layers \
                      --event-handlers console_cohesion+
          colcon test-result --verbose

          cd src/rx26_asv && python3 -m pytest -q
