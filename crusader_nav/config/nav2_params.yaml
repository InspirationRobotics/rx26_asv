# Crusader Nav2: planner_server + global costmap only. No bt_navigator, no controller.
# This spec is docs/nav2_avoidance_spec.md. Frames: docs section 2. Never set use_sim_time
# (the sim runs on wall clock).
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0          # warn if one plan takes >0.5 s
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5                         # m; only used when the exact goal is unreachable
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true                    # open water is never "seen free" by a LiDAR
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 0.5                 # s, search + smoothing. BT times out at 1.0
      cost_travel_multiplier: 2.0            # Humble code default 1.0; docs advise 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      width: 80                              # m (int). BT clips goals to 35 m
      height: 80
      resolution: 0.1
      # 0.82 * cos(pi/16) = 0.804 m INSCRIBED radius: Nav2 makes the circle a
      # 16-gon (footprint.cpp makeFootprintFromRadius / calculateMinAndMaxDistances).
      # This IS the "0.8 m hard" clearance from an obstacle surface. check_config
      # asserts it against bt_runner_node.nav_hard_m.
      robot_radius: 0.82
      footprint_padding: 0.0
      track_unknown_space: false
      update_frequency: 5.0
      publish_frequency: 1.0
      always_send_full_costmap: false
      transform_tolerance: 0.5
      plugins: ["hazard_layer", "stvl_layer", "inflation_layer"]
      hazard_layer:
        plugin: "crusader_nav_layers::HazardLayer"
        enabled: true
        topic: "/crsd/nav/hazards"
        max_age_s: 5.0                       # bt_runner publishes at 2 Hz
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 30.0                    # s, linear: OUT-OF-VIEW memory
        decay_model: 0
        voxel_size: 0.1                      # = resolution
        track_unknown_space: false
        max_obstacle_height: 5.0
        mark_threshold: 0
        update_footprint_enabled: false      # never erase a real return near the hull
        combination_method: 1                # max: never lowers HazardLayer's LETHAL
        obstacle_range: 40.0
        origin_z: 0.0
        publish_voxel_map: true              # STVL-only marks (PointCloud2, map frame): /global_costmap/voxel_grid, read by panel_feed
        transform_tolerance: 0.5
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: lidar_mark lidar_clear
        lidar_mark:
          data_type: PointCloud2
          topic: /crsd/nav/obstacle_cloud
          marking: true
          clearing: false
          # obstacle_range is PER SOURCE in STVL and defaults to 2.5 m (the layer-level 40.0 above is
          # not inherited): left out, every return beyond 2.5 m is dropped and the voxel grid stays EMPTY
          # with no warning. Found 2026-10-01 (crsd-sim:nav2): the LiDAR-only platform and buoys were
          # never marked until this was set; the buoys at 15 m then became lethal cells.
          obstacle_range: 40.0
          min_obstacle_height: 0.0           # cloud is already water-gated upstream
          max_obstacle_height: 5.0
          expected_update_rate: 1.0          # s; silence -> costmap not current -> no plans
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true
          filter: "passthrough"              # downsampled upstream
          voxel_min_points: 0
        lidar_clear:
          enabled: true
          data_type: PointCloud2
          topic: /crsd/nav/obstacle_cloud
          marking: false
          clearing: true
          obstacle_range: 40.0               # same per-source default trap as lidar_mark
          model_type: 1                      # 3D lidar (hourglass frustum)
          horizontal_fov_angle: 3.14         # rad: the 180 deg forward sector
          vertical_fov_angle: 1.82           # rad: +/-52 deg covers the inverted MID360's -52..+7
          vertical_fov_padding: 0.3          # m
          min_z: 0.5                         # m, = lidar_cluster_node r_min
          max_z: 20.0                        # m: in-view decay only where a 0.3 m buoy is reliably seen
          decay_acceleration: 5.0            # 1/s^2: in-view & unseen -> gone in ~3 s
          # 0 = no staleness check on THIS source. Measured 2026-10-01 (crsd-sim:nav2, STVL 2.3.4):
          # with 1.0 here this buffer is never marked updated, warns "buffer updated in Ns" at 5 Hz
          # and the costmap stays non-current forever, so every plan hangs. lidar_mark carries the
          # same topic and DOES update, so silence is still caught there.
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 2.0                # "2 m soft", from the obstacle surface
        cost_scaling_factor: 2.0             # cost 208@0.9 m, 170@1.0, 114@1.2, 63@1.5, 23@2.0
        inflate_unknown: false
        inflate_around_unknown: false

# crusader_nav/nav_lifecycle.py replaces nav2_lifecycle_manager (2026-10-01): Humble's manager
# calls change_state with no timeout and hung forever on one reply Fast DDS dropped. Floats stay
# floats here: rcl will not take 3 for a double.
nav_lifecycle:
  ros__parameters:
    node_names: ["planner_server"]           # configured, activated, and again after a respawn
    check_period_s: 1.0                      # get_state this often; one call at a time
    call_timeout_s: 3.0                      # an unanswered call is dropped and asked again
    recreate_after_timeouts: 3               # in a row -> new service clients (fresh discovery)

