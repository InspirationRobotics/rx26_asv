# ============================================================================
# Crusader — SINGLE SOURCE OF TRUTH for all ROS-side parameters (Phase 3.5).
#
# Standard ROS 2 parameter-file format: pass to launch via
#     parameters=[os.path.join(pkg_share, "config", "crusader_params.yaml")]
# or per-node:  ros2 run ... --ros-args --params-file config/crusader_params.yaml
#
# Node code loads THIS file for its declaration defaults (api/common/config.py),
# and the episode evaluator reads the same file for objective-2 thresholds — so
# the onboard at-risk detector and the scoring pipeline cannot drift apart.
# The file's sha256 is recorded in every episode metrics JSON (ros_config_hash).
#
# Parameter posture (enforced in code via ParameterDescriptor):
#   [RO] read_only — safety/structural; `ros2 param set` is REJECTED; change
#        here + restart the node (rebuild NOT required, params load at start).
#   [DYN] dynamic — accepted at runtime via `ros2 param set`, range-validated;
#        this is the knob path for test-day tuning and the Level-1 loop.
#
# ---------------------------------------------------------------------------
# TWO HARD FORMAT RULES — rcl's parser is stricter than PyYAML. Break either and
# EVERY node in the launch dies at rclpy.init() with "Couldn't parse params
# file", before a single line of node code runs (this happened on the boat on
# 2026-07-29 and grounded the whole stack, LEDs included):
#
#   1. NO YAML anchors/aliases (&name / *name). rcl_yaml_param_parser rejects
#      them outright — it is a token-level parser, not a YAML document loader.
#      Values that MUST stay equal across sections are therefore written out
#      LITERALLY and pinned by tests/test_config_shared.py instead. If you
#      change one, change every copy the test names.
#   2. EVERY top-level key must be a node name whose only child is
#      `ros__parameters:`. A bare scalar at top level is what produced
#      "Cannot have a value before ros__parameters". That is why the `shared`
#      block below — which is documentation, not a real node — still carries a
#      `ros__parameters:` level: no node is named `shared`, so rcl parses the
#      section, matches it to nothing, and ignores it.
#
# tests/test_config_shared.py enforces both rules in CI. Do not "tidy" this file
# back into anchors.
# ============================================================================

# Canonical values for anything duplicated below. NOT a real node (see rule 2) —
# this section is the single source of truth by convention + test, and is never
# loaded by any running node.
shared:
  ros__parameters:
    # cells at/above this confidence count as obstacles — used by BOTH the grid
    # node (publisher) and the APF node (consumer); they must stay in lockstep
    occupied_threshold: 50.0
    # age at which a /crsd/pose sample stops being usable. telemetry_bridge uses
    # it to decide when to STOP republishing a dead MAVLink stream; every
    # consumer uses the same number to decide when to stop acting on the last
    # pose it saw. One value because a consumer trusting a pose longer than the
    # bridge vouches for it is exactly the frozen-pose failure this guards
    # against.
    pose_timeout_s: 1.0
    # progress-monitor thresholds — onboard detector AND episode evaluator
    progress_window_s: 10.0
    progress_speed_floor: 0.3
    progress_floor: 0.5
    progress_heading_osc_floor: 0.05
    progress_stall_after_s: 15.0

telemetry_bridge:
  ros__parameters:
    mav_endpoint: "udp:127.0.0.1:14551"   # [RO] MAVProxy rebroadcast, never serial
    drop_channel: 9                        # [RO] autonomy-drop RC channel (1..18);
                                           #      SE per OPERATIONS §6.
                                           #      NOT ch7: ch7 is RC7_OPTION=165
                                           #      (arm/e-stop) and its NORMAL ARMED
                                           #      position (1995) is >= the
                                           #      threshold below, so a ch7 latch
                                           #      sat permanently tripped and
                                           #      blocked every RC override AND
                                           #      GUIDED setpoint whenever the boat
                                           #      was armed — i.e. dp_hold and
                                           #      gate_navigator could never
                                           #      actuate.
                                           #      >= 9 is also structurally safer:
                                           #      _send_override truncates to 8
                                           #      channels, so no override in the
                                           #      graph can write the very input
                                           #      the latch reads.
                                           #      BENCH-VERIFY the SE detent us
                                           #      values before trusting this
                                           #      (G1 test 3) — a drop switch that
                                           #      silently does nothing is worse
                                           #      than none.
    drop_threshold: 1700                   # [RO] us; crossing trips the latch
    drop_invert: false                     # [RO]
    rc_stale_timeout: 1.0                  # [RO] s without RC -> trip
    stream_timeout_s: 1.0                  # [RO] = shared.pose_timeout_s; s
                                           #      before a stale FAST stream
                                           #      (pose, RC) stops being
                                           #      republished
    status_timeout_s: 3.0                  # [RO] same, for the SLOW autopilot
                                           #      status streams. HEARTBEAT is a
                                           #      FIXED 1 Hz (no SR* raises it)
                                           #      and SYS_STATUS runs at
                                           #      SR*_EXT_STAT (2 Hz here), so
                                           #      1.0 marks both stale on jitter
                                           #      alone: /crsd/fcu_status flapped
                                           #      continuously and consumers
                                           #      froze on their last value.

perception_node:
  ros__parameters:
    engine_path: "/root/robotx_ws/models/buoy_v16.engine"   # [RO] per-Jetson
    mount_offset_x: 0.0                    # [RO] camera in BODY frame [m]
    mount_offset_y: 0.3                    # [RO]
    conf_threshold: 0.4                    # [DYN] detector confidence floor (0..1)
    latency_budget_ms: 100.0               # [DYN] health budget
    fps_floor: 15.0                        # [DYN] health budget

# ---- livox_lidar: Livox MID360 driver (livox_ros_driver2) ----
# The driver's ROS-level params live here so this file stays the single source of
# truth; lidar.launch.py loads this section (the node is named `livox_lidar`).
# The MID360's NETWORK/IP layer (host IP, LiDAR IP, ports) stays in
# config/MID360_config.json — the driver requires its own JSON via
# `user_config_path`, which the launch sets to this package's installed share copy
# of that file (so it is NOT duplicated here). Extrinsics also do NOT go here or in
# that JSON: they are owned by lidar_fusion_node's `lidar_*` params below (single
# source of truth; MID360_config.json must stay identity — enforced at node start).
livox_lidar:
  ros__parameters:
    xfer_format: 0             # [RO] 0 = PointCloud2 (what lidar_fusion_node parses); 1 = CustomMsg
    multi_topic: 0             # [RO] 0 = one /livox/lidar topic for all sensors
    data_src: 0                # [RO] 0 = live LiDAR (replay modes unused)
    publish_freq: 10.0         # [RO] point-cloud publish rate [Hz] (driver reads at start)
    output_data_type: 0        # [RO]
    frame_id: "livox_frame"    # [RO] TF frame stamped on the cloud
    cmdline_input_bd_code: ""  # [RO] broadcast-code override (blank = use the JSON config)

# ---- lidar_fusion_node: Livox MID360 <-> camera detection fusion (perception) ----
# Subscribes /crsd/detections_body (camera, associate() output) + /livox/lidar
# (PointCloud2); refines each detection's RANGE with LiDAR returns that share its
# bearing AND agree with its camera range, republishes /crsd/detections_fused.
# Camera-only detections are PASSED THROUGH (never dropped) when no LiDAR support —
# losing an obstacle is worse than a coarse range (objective 1). Extrinsics [RO]
# MUST be calibrated vs the OAK-D before fused ranges are trustworthy; until then
# expect /crsd/fusion_health to report `never_agrees` rather than silence.
#
# The three association gates run in order (see api/perception/lidar_fusion.py):
#   bearing_gate_deg -> range_gate_frac/_abs -> cluster_gap_m + min_points
# Bearing alone is NOT sufficient: the MID360 sees 360 deg, so the wedge behind a
# buoy usually contains a shoreline that out-votes it and drags the fused range
# onto the background. Widening range_gate_frac toward its 2.0 ceiling restores
# that failure — read the module docstring before tuning it up.
lidar_fusion_node:
  ros__parameters:
    lidar_roll_deg: 0.0        # [RO] LiDAR pose in BODY (calibrate vs OAK-D)
    lidar_pitch_deg: 0.0       # [RO]
    lidar_yaw_deg: 0.0         # [RO]
    lidar_x: 0.0               # [RO] LiDAR position in BODY, starboard+ [m]
    lidar_y: 0.0               # [RO] forward+ [m]
    lidar_z: 0.0               # [RO] up+ [m]
    bearing_gate_deg: 4.0      # [DYN] +/- bearing window around a detection [deg]
    z_min: -0.5                # [DYN] BODY-z band low: reject water/ground returns [m]
    z_max: 3.0                 # [DYN] BODY-z band high: reject sky/superstructure [m]
    r_min: 0.5                 # [DYN] ignore returns closer than this [m]
    r_max: 60.0                # [DYN] MID360 range ceiling used for fusion [m]
    min_points: 3              # [DYN] LiDAR returns needed to accept a range fix
    range_gate_frac: 0.5       # [DYN] range window = max(abs, frac * camera_range)
    range_gate_abs: 2.0        # [DYN] absolute floor on that window [m]
    cluster_gap_m: 2.0         # [DYN] radial gap that separates two objects [m]
    cloud_timeout_s: 0.5       # [DYN] older cloud -> pass camera through + WARN

occupancy_grid_node:
  ros__parameters:
    cell_size: 0.5                         # [RO] grid geometry
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s;
                                           #      stale pose -> stop ingesting
    decay_tau: 30.0                        # [DYN] perception-cell decay [s]
    occupied_threshold: 50.0               # [DYN] = shared.occupied_threshold

mission_planner_node:
  ros__parameters:
    robocommand_host: "127.0.0.1"          # [RO] RJ-45 RoboCommand net at comp;
    robocommand_port: 9500                 # [RO] mock_robocommand in test
    vehicle_id: "crusader"                 # [RO]
    tick_rate_hz: 5.0                      # [RO]
    mission_file: ""                       # [RO] JSON {"waypoints": [[lat,lon],..]}
                                           #      To generate from a QGC .plan:
                                           #      tools/scripts/plan_to_mission.py
                                           #      Convention:
                                           #      /root/robotx_ws/missions/<name>.json
                                           #      — workspace level, beside models/;
                                           #      per-venue data, kept OUT of the repo.
                                           #      ~/robotx_ws is the only bind-mounted
                                           #      host path, so anywhere else is either
                                           #      invisible to the node or lost on
                                           #      `docker rm`. Absolute path only: the
                                           #      node does NOT expand `~`, so a tilde
                                           #      here is a directory literally named
                                           #      `~`. Deliberately left empty: the
                                           #      node then fails at startup with
                                           #      instructions, which beats a default
                                           #      path that dies on FileNotFoundError.
    wp_radius: 2.0                         # [RO] mirrors ArduRover WP_RADIUS
    loiter_radius: 3.0                     # [RO] Mission-4 assist loiter
    loiter_min_s: 5.0                      # [RO] dwell before READINESS

roa_apf_node:
  ros__parameters:
    rate_hz: 5.0                           # [RO]
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s; stop
                                           #      advising on a stale pose
    occupied_threshold: 50.0                # [DYN] = shared.occupied_threshold;
                                            #       must track the grid's value
    # --- APF gains: the primary Level-1 tunables on the ROS side [DYN] ---
    apf_k_att: 1.0
    apf_k_rep: 5.0
    apf_influence_m: 6.0
    apf_lookahead_m: 8.0
    apf_slow_radius_m: 4.0
    apf_min_speed_scale: 0.2
    apf_trap_ratio: 0.15
    apf_tangent_gain: 0.8
    apf_project_s: 5.0
    # --- progress monitor: mirrors the `shared` section, pinned by
    #     tests/test_config_shared.py (rcl forbids anchors — see header) [RO] ---
    # read-only because the monitor is stateful; changing thresholds mid-episode
    # would corrupt flag/stall accounting. Tune here + restart between runs.
    monitor_window_s: 10.0                 # = shared.progress_window_s
    monitor_speed_floor: 0.3               # = shared.progress_speed_floor
    monitor_progress_floor: 0.5            # = shared.progress_floor
    monitor_heading_osc_floor: 0.05        # = shared.progress_heading_osc_floor
    monitor_stall_after_s: 15.0            # = shared.progress_stall_after_s

# ---- LED status stack (operational nodes, ported from the Crusader boat repo) ----
led_node:
  ros__parameters:
    port: "/dev/crsd-led"                  # [RO] udev symlink (tools/udev), not by-id
    baud: 115200                           # [RO] must match firmware/LED.ino Serial.begin
    reconnect_s: 3.0                       # [RO] serial reconnect retry period [s]

pixhawk_led_status_node:
  ros__parameters:
    estop_channel: 7                       # [RO] SB e-stop switch channel (RC reference)
    estop_threshold: 1200                  # [RO] us; below = e-stopped. NOT a
                                           #      reliable RC-loss signal on its
                                           #      own — an ELRS receiver set to
                                           #      "Last Position" holds ch7 high
                                           #      through a dead TX. The node
                                           #      also fails RED on the
                                           #      /crsd/rc_link_health bit.
    autonomy_hold_s: 1.0                   # [RO] stay GREEN this long after last autonomy beat
    input_timeout_s: 2.0                   # [RO] s without a bridge topic -> RED.
                                           #      Must exceed the bridge's own
                                           #      status_timeout_s margin; the
                                           #      bridge republishes at 20 Hz
                                           #      while a stream is fresh, so 2.0
                                           #      is ~40 missed messages.
    rate_hz: 5.0                           # [RO] LED state evaluation rate

# ---- rc_heartbeat_watchdog: force-disarm on RC-transmitter link loss (safety) ----
# Consumes telemetry_bridge topics (/crsd/rc_channels, /crsd/fcu_status,
# /crsd/rc_link_health) and routes a force-disarm back through the bridge
# (/crsd/force_disarm) — no own MAVLink conn.
# Complements ArduPilot FS_THR/FS_GCS and the hardware SB e-stop (defense in depth).
# All params [RO]: safety config, change here + restart. rc_channel/reset_channel
# share ch7 (the SB switch) with telemetry_bridge/pixhawk_led as read-only inputs.
#
# RECEIVER PREREQUISITE: the ELRS receiver's failsafe must be set to "No Pulses",
# not "Last Position". Measured on Crusader 2026-08-02 with Last Position, ch7 held
# 1995 through a full TX power-down and the PWM path below never fired. The
# /crsd/rc_link_health signal now catches that case, but it is a second line of
# defense — do not rely on it to paper over a misconfigured receiver.
rc_heartbeat_watchdog:
  ros__parameters:
    heartbeat_timeout: 1.0                 # [RO] s of stale monitored-channel PWM -> RC link lost
    rc_channel: 7                          # [RO] channel whose valid PWM is the RC heartbeat
    min_valid_pwm: 900                     # [RO] us; below = no pulses. Only fires
                                           #      if the receiver actually stops
                                           #      output — see prerequisite above.
    require_armed: true                    # [RO] only force-disarm when armed
    link_timeout: 3.0                      # [RO] s without any bridge topic -> gateway deemed down
    enable_latch: false                    # [RO] true = hold kill until RC reset toggle clears it
    reset_channel: 7                       # [RO] channel whose low->high toggle clears the latch
    reset_low_pwm: 1300                    # [RO] us; reset switch "low" below this
    reset_high_pwm: 1700                   # [RO] us; reset switch "high" above this

# ---- dp_hold: MANUAL RC-override lateral hold (Mission 3 docking) ----
# gains are [RO] for now (change here + restart); making them [DYN] for the
# Level-1 loop (CLAUDE.md lists dp_hold gains as Level-1 tunables) is a follow-up
# that also needs a make_set_callback in the node.
dp_hold:
  ros__parameters:
    target_classes: ["buoy_flash_green"]   # [RO] canonical labels to lock onto
    target_yaw_deg: 240.0                  # [RO] hold heading [deg]
    target_forward_m: 2.0                  # [RO] hold target this far ahead [m]
    target_lateral_m: 0.0                  # [RO] lateral offset (0 = centered)
    conf_min: 0.5                          # [RO] detection confidence floor
    lost_timeout_s: 1.0                    # [RO] s without target -> hold yaw only
    grace_s: 20.0                          # [RO] s after last sight before disengaging
    kp_yaw: 4.0                            # [RO] PWM per deg yaw error
    kd_yaw: 3.0                            # [RO] PWM per deg/s (yaw damper)
    kp_fwd: 90.0                           # [RO] PWM per m forward error
    kp_lat: 90.0                           # [RO] PWM per m lateral error
    pwm_limit: 120                         # [RO] max PWM deflection from neutral
    dead_yaw_deg: 5.0                      # [RO] ignore smaller yaw errors
    dead_pos_m: 0.15                       # [RO] ignore smaller position errors
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s;
                                           #      stale heading -> release override
    rate_hz: 10.0                          # [RO] control rate

# ---- gate_navigator: GUIDED-mode buoy-gate transit (Mission 1) ----
gate_navigator:
  ros__parameters:
    mission_file: ""                       # [RO] JSON {"waypoints": [[lat,lon],...]}; required
                                           #      Same convention as
                                           #      mission_planner_node above:
                                           #      /root/robotx_ws/missions/<name>.json
                                           #      (workspace level, absolute path — `~`
                                           #      is NOT expanded). Generate with
                                           #      tools/scripts/plan_to_mission.py.
    gate_wp_indices: [0, 1]                # [RO] zero-based waypoints treated as gates;
                                           #      positional, so they renumber if the
                                           #      waypoint list changes — re-read the
                                           #      converter's printed indices after any
                                           #      re-plan.
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s;
                                           #      stale pose -> stop commanding
    cmd_period_s: 1.0                      # [RO] min seconds between guided setpoints
    rate_hz: 20.0                          # [RO] control rate

# ---- actuator_node: Mission 3 effectors (delivery launcher + water cannon) ----
# FIRMWARE: char/PWM protocol mirrors the RoboBoat Maestro controller — confirm on
# the bench against Crusader's actual actuator firmware before trusting it.
actuator_node:
  ros__parameters:
    port: "/dev/crsd-ball-launcher"        # [RO] Maestro/Arduino serial (udev symlink)
    baud: 9600                             # [RO] Maestro default
    launch_char: "g"                       # [RO] fire command char
    reload_char: "a"                       # [RO] reload command char
    fire_gap_s: 0.5                        # [RO] delay between fire and reload [s]
    pump_channel: 0                        # [RO] Maestro channel for the water pump
    pump_on_us: 2000                       # [RO] pump-ON pulse width [us]
    pump_off_us: 1000                      # [RO] pump-OFF pulse width [us]

# ---- ivc_node: inter-vehicle comms over team WiFi (Bullet AC link) ----
# Separate from the RJ-45 RoboCommand link and the Pixhawk link. Exactly one peer
# per pairing runs role="server".
ivc_node:
  ros__parameters:
    role: "client"                         # [RO] "server" (bind/wait) or "client" (connect)
    partner_ip: "192.168.8.229"            # [RO] peer IP (client role only)
    port: 65432                            # [RO]
    reconnect_s: 2.0                       # [RO] (re)connect retry period [s]
    poll_hz: 20.0                          # [RO] inbound-queue drain rate
