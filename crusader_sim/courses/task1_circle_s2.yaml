# task1_circle_s2 — a RANDOM DENSE Task 1 field: gen_dense_course.py --shape circle --seed 2.
# Neighbours 2-4 m apart (as on the 2026 Singapore field, task1_sg.yaml).
# CIRCLE: buoys spread evenly over a disc, the channel curving from the ENTRY (south rim)
# to the EXIT (north rim): RED to starboard, GREEN to port, some lights off (BLACK).
# Regenerate rather than hand-edit.
# Nearest neighbour per buoy: min 2.65 m, mean 3.09 m, max 3.61 m. 10 buoys in 9.4 x 10.0 m (east x north).

name: task1_circle_s2
origin: {lat: 1.28060, lon: 103.85570}
draft_m: 0.24
depth_m: 5.0
boat_start: {x: 0.46, y: -15.00, yaw_deg: 90.0}
field_centre: {x: 0.15, y: 0.45}   # the operator's click: the centroid
staging: {x: 0.46, y: -11.00}   # 6 m off the ENTRY, outside: task1_goal --staging
tier: core

elements:
  - {type: robobuoy, name: entry, x: 0.46, y: -5.00, beacon: flash_blue, up_beacon: false}
  - {type: robobuoy, name: r1, x: 3.56, y: -3.15, beacon: flash_red, up_beacon: false}
  - {type: robobuoy, name: r2, x: 1.64, y: -0.05, beacon: flash_red, up_beacon: false}
  - {type: robobuoy, name: r3, x: 4.85, y: 0.79, beacon: flash_red, up_beacon: false}
  - {type: robobuoy, name: r4, x: 3.25, y: 3.36, beacon: flash_red, up_beacon: false}
  - {type: robobuoy, name: g1, x: -3.05, y: -2.42, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: g2, x: -2.15, y: 0.42, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: g3, x: -2.97, y: 3.89, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: exit, x: 0.45, y: 5.00, beacon: steady_blue, up_beacon: false}
  - {type: robobuoy, name: black1, x: -4.51, y: 1.63, beacon: "off"}
