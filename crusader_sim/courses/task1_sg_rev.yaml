# Task 1 Safe Passage — the REAL Singapore field, driven SOUTHBOUND.
#
# Same buoys as task1_sg.yaml (LiDAR map of 2026-11-10, read its header). ENTRY at the north
# end, EXIT at the south end: southbound, starboard is WEST, so every RED is on the west column
# and every GREEN on the east. The boat starts at the launch (south) and must go round the field
# to reach the ENTRY, which is what a randomised course can ask of it.

name: task1_sg_rev
origin: {lat: 1.28050, lon: 103.85570}
draft_m: 0.24
depth_m: 5.0
boat_start: {x: -1.0, y: -2.0, yaw_deg: 90.0}
tier: core

elements:
  - {type: robobuoy, name: b01_exit,  x: -4.52, y:  9.02, beacon: steady_blue, up_beacon: false}
  - {type: robobuoy, name: b02_red,   x: -8.62, y:  9.69, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: b03_grn,   x: -4.35, y: 12.40, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: b04_red,   x: -7.30, y: 12.46, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: b05_red,   x: -7.36, y: 14.80, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: b06_grn,   x: -5.10, y: 14.90, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: b07_black, x: -0.53, y: 15.26, beacon: "off"}
  - {type: robobuoy, name: b08_grn,   x: -3.20, y: 16.55, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: b09_red,   x: -5.78, y: 17.91, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: b10_grn,   x: -4.06, y: 18.62, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: b11_entry, x: -5.22, y: 21.91, beacon: flash_blue,  up_beacon: false}
