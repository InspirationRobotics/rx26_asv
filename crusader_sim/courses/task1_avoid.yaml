# Task 1 with four black buoys ON the legs the planner drives: the Task 1 panel's DEFAULT
# template, for watching Nav2 avoidance work (docs/nav2_avoidance_spec.md 10.2). The frame
# and the rules are task1_core.yaml's (read its header). 77 m long, 10 buoys:
#   ENTRY (9, 3), gate 1 at x 30, gate 2 at x 55, EXIT (77, -1), each gate 9 m wide
#   (red on -y = starboard, green on +y), and four obstacles, beacon off.
#
# Where the obstacles are: the tree plans three kinds of leg through Nav2 (task1_disruptive.xml):
# ring end -> gate approach (8 m short of the gate's middle), the gate's through point (6 m past
# the middle) -> the next gate's approach point, and the last through point -> the EXIT ring
# (ring radius 6 m). The crossing itself (approach -> through) is driven STRAIGHT and any other
# object on it holds the boat, so nothing stands between a gate's approach and through points.
#   avoid1 (17.9,  0.3)  on the line ENTRY -> gate 1 approach (22, -1): 9.3 m from the
#                        ENTRY, 3.3 m outside its ring, 4.3 m before the approach point
#   avoid2 (39.5,  0.1)  gate 1 through (36, -1) -> gate 2 approach (47, 2): 3.7 m along,
#   avoid3 (43.5,  1.1)  and 7.8 m along; both within 0.15 m of that line, 4.1 m apart
#   avoid4 (66.0,  1.1)  on the line gate 2 through (61, 2) -> the EXIT ring start (71.1, 0.1):
#                        11.2 m from the EXIT
# Every obstacle is >= 10 m from every gate buoy and has open water on both sides (the nearest
# other buoy is 4 m away along the line, 9 m or more across it). The straight line is blocked
# at each, so the planner has to go round (either side), keeping >= 0.8 m centre to surface.
# Pass: referee PASS and no obstacle touched.
#
# RXL_SAFE_PASSAGE carries at most 10 buoys (robotx dialect, array length 10): ENTRY, 2 gates,
# EXIT and the 4 obstacles make exactly 10. With 11 the UAV stand-in cannot send the field and
# the tree fails at once (found 2026-10-01).

name: task1_avoid
origin: {lat: 1.28060, lon: 103.85570}   # = tools/sitl/start_sitl.sh SITL_HOME
draft_m: 0.24
depth_m: 5.0
boat_start: {x: 0.0, y: 0.0, yaw_deg: 0.0}
tier: core

elements:
  - {type: robobuoy, name: entry,  x:  9.0, y:  3.0, beacon: flash_blue,  up_beacon: false}
  - {type: robobuoy, name: g1_red, x: 30.0, y: -5.5, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: g1_grn, x: 30.0, y:  3.5, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: g2_red, x: 55.0, y: -2.5, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: g2_grn, x: 55.0, y:  6.5, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: exit,   x: 77.0, y: -1.0, beacon: steady_blue, up_beacon: false}
  - {type: robobuoy, name: avoid1, x: 17.9, y:  0.3, beacon: "off"}
  - {type: robobuoy, name: avoid2, x: 39.5, y:  0.1, beacon: "off"}
  - {type: robobuoy, name: avoid3, x: 43.5, y:  1.1, beacon: "off"}
  - {type: robobuoy, name: avoid4, x: 66.0, y:  1.1, beacon: "off"}
