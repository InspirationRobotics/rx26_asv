# Task 3 Coordinated Logistics — the USV's half: the dock and the "fire".
#
# Dock geometry mirrors tools/task3_sim/world.py (the team's no-ROS Task 3 sim)
# so the Task 3 tree sees the same course in both: dock back edge 20 m north of
# the start, bays opening SOUTH (world.py facing 180 compass = ENU yaw -90).
# Handbook: 3.3.4 + docking-bay-structure.md; see gen_world.dock() for sources.
#
# USV job (3.3.4:13-51): find the GREEN bay, dock fully, DockingReport, spray the
# lit window until RED -> GREEN, FirefightingReport. The lit window starts RED
# here ("on fire"); the beacon_driver node can switch it.
#
# The platforms and UAV pad are the UAV's half of Task 3 (tins, 40-50 g). Their
# positions are image only (3.3.4:7) — placed for looks, not from the handbook.

name: task3
origin: {lat: 1.28060, lon: 103.85570}
draft_m: 0.24
depth_m: 5.0
boat_start: {x: 0.0, y: 0.0, yaw_deg: 90.0}
tier: disruptive

elements:
  - type: dock
    name: dock
    x: 0.0
    y: 20.0
    facing_deg: -90.0          # ENU yaw the faces point OUT (-90 = south)
    green_bay: 2               # 1..3, left to right as seen from the water
    lit_window: {bay: 2, slot: 0, colour: red}   # slot 0 = upper-left, 1 = lower-right
  - {type: platform, name: platform_red,  x: -10.0, y: 12.0, circle: red}
  - {type: platform, name: platform_blue, x:  10.0, y: 12.0, circle: blue}
  - {type: launch_pad, name: uav_pad, x: -6.0, y: -4.0}
