# task1_circle_s3 — a RANDOM DENSE Task 1 field: gen_dense_course.py --shape circle --seed 3.
# Neighbours 2-4 m apart (as on the 2026 Singapore field, task1_sg.yaml).
# CIRCLE: buoys spread evenly over a disc, the channel curving from the ENTRY (south rim)
# to the EXIT (north rim): RED to starboard, GREEN to port, some lights off (BLACK).
# Regenerate rather than hand-edit.
# Nearest neighbour per buoy: min 2.67 m, mean 3.01 m, max 3.79 m. 10 buoys in 9.5 x 10.0 m (east x north).

name: task1_circle_s3
origin: {lat: 1.28060, lon: 103.85570}
draft_m: 0.24
depth_m: 5.0
boat_start: {x: -0.26, y: -15.00, yaw_deg: 90.0}
field_centre: {x: -0.38, y: -0.03}   # the operator's click: the centroid
staging: {x: -0.26, y: -11.00}   # 6 m off the ENTRY, outside: task1_goal --staging
tier: core

elements:
  - {type: robobuoy, name: entry, x: -0.26, y: -5.00, beacon: flash_blue, up_beacon: false}
  - {type: robobuoy, name: r1, x: 1.95, y: -2.56, beacon: flash_red, up_beacon: false}
  - {type: robobuoy, name: r2, x: 4.59, y: -1.17, beacon: flash_red, up_beacon: false}
  - {type: robobuoy, name: r3, x: 0.76, y: -0.16, beacon: flash_red, up_beacon: false}
  - {type: robobuoy, name: r4, x: 3.62, y: 1.58, beacon: flash_red, up_beacon: false}
  - {type: robobuoy, name: g1, x: -4.20, y: -2.20, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: g2, x: -4.88, y: 0.71, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: g3, x: -3.40, y: 3.44, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: exit, x: 0.04, y: 5.00, beacon: steady_blue, up_beacon: false}
  - {type: robobuoy, name: black1, x: -2.00, y: 0.04, beacon: "off"}
