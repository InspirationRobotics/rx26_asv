# task3_aim_ul — the cannon's AIM TEST on the upper-left window (`sim aimtest ul`).
# As task3_aim_lr.yaml, on the UPPER-LEFT window (1.05 m above the water).
#
# Its distances are few: a level camera ~0.22 m above the water first sees half of
# it from ~1.63 m (LiDAR to the back wall), and at the measured 4.85 m/s the water
# reaches it only to ~1.82 m.

name: task3_aim_ul
origin: {lat: 1.28060, lon: 103.85570}
draft_m: 0.24
depth_m: 5.0
boat_start: {x: 0.0, y: 16.6, yaw_deg: 90.0}
tier: core
code: [red, blue]
extinguish_s: 1000.0        # the window stays lit: every shot aims at a burning window

elements:
  - type: dock
    name: dock
    x: 0.0
    y: 20.0
    facing_deg: -90.0
    green_bay: 2
    lit_window: {bay: 2, slot: 0, colour: red}   # the upper-left
