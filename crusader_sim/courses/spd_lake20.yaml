# spd_lake20 — SIM-ONLY scratch course for the 2026-10-12 Task 1 speed-tuning campaign.
# Not a team course; safe to delete. Shaped like the 4 Oct lake field (log 00000045.BIN):
# ENTRY and EXIT 20 m apart, three red/green gates between them, the first gate close
# enough to ENTRY that the whole-field planner caps the entry orbit near 3 m and the
# last gate close enough to EXIT to cap the exit orbit near 2.2 m.
# World frame: ENU metres from origin; the boat starts at the origin heading east, so
# starboard is SOUTH (-y) and red sits on -y.
name: spd_lake20
origin: {lat: 1.28060, lon: 103.85570}
draft_m: 0.24
depth_m: 5.0
boat_start: {x: 0.0, y: 0.0, yaw_deg: 0.0}
tier: advanced

elements:
  - {type: robobuoy, name: entry,  x:  8.0, y:  0.0, beacon: flash_blue,  side_beacon: false, up_beacon: true}
  - {type: robobuoy, name: g1_red, x: 12.5, y: -2.5, beacon: flash_red,   side_beacon: false, up_beacon: true}
  - {type: robobuoy, name: g1_grn, x: 12.5, y:  2.5, beacon: flash_green, side_beacon: false, up_beacon: true}
  - {type: robobuoy, name: g2_red, x: 18.0, y: -1.5, beacon: flash_red,   side_beacon: false, up_beacon: true}
  - {type: robobuoy, name: g2_grn, x: 18.0, y:  3.5, beacon: flash_green, side_beacon: false, up_beacon: true}
  - {type: robobuoy, name: g3_red, x: 24.5, y: -3.0, beacon: flash_red,   side_beacon: false, up_beacon: true}
  - {type: robobuoy, name: g3_grn, x: 24.5, y:  2.0, beacon: flash_green, side_beacon: false, up_beacon: true}
  - {type: robobuoy, name: exit,   x: 28.0, y:  0.0, beacon: steady_blue, side_beacon: false, up_beacon: true}
