# Task 1 Safe Passage - task1_sg_DENSE: task1_sg (the measured Singapore field, every light
# flashing but the solid-blue EXIT) squeezed toward its centre by 1/sqrt(2): twice the buoys per
# square metre, every gap x0.71. A stress course (requested 2026-11-13): the sim draws the small
# handbook RoboBuoy (0.43 m), the Singapore buoys are bigger, so the real gaps are tighter than
# task1_sg's. Centre -5.09 E, 14.87 N (same lat/lon as task1_sg's centre).
#
# Task 1 Safe Passage — the REAL Singapore field (Marina Bay, measured 2026-11-10).
#
# Buoy positions are the LiDAR map of run 20261110-030810 (Crusader inside the field, MID360,
# steady scans registered; scratchpad lidar/buoys.csv of the 2026-11-11 session). Repeatable to
# ~0.12 m against run 025236 once a 3 m GPS offset between the two runs is removed, so the
# GEOMETRY (gaps, spacing) is trusted; the absolute lat/lon only to a few metres.
#
#   11 buoys in two columns ~3 m apart, field ~8 m x 13 m.
#   centre-to-centre to the nearest neighbour: min 1.86, median 2.35, max 3.48 m
#   tightest surface gaps: 09-10 1.48 m, 08-10 1.89 m, 05-06 1.90 m, 04-05 2.05 m
#
# The LIGHT ASSIGNMENT is ours: the beacons were unlit on 2026-11-10, and the course picks a
# random one per run (3.3.2). This file is the natural one for a two-column field: ENTRY at the
# south end (nearest the launch), EXIT at the north end, the channel between the columns, so
# northbound every RED is on the east column (starboard) and every GREEN on the west (port).
# task1_sg_rev.yaml drives it the other way; task1_sg_black.yaml turns three lights off.
#
# World frame: ENU metres from `origin` (x east, y north) = the LiDAR map's origin, so x/y
# below are the measured E/N. The boat starts where the 2026-11-10 runs began, heading north.

name: task1_sg_dense
origin: {lat: 1.28050, lon: 103.85570}
draft_m: 0.24
depth_m: 5.0
boat_start: {x: -1.0, y: -2.0, yaw_deg: 90.0}
tier: core

elements:
  - {type: robobuoy, name: b01_entry, x:  -4.69, y:  10.73, beacon: flash_blue,  up_beacon: false}
  - {type: robobuoy, name: b02_grn, x:  -7.59, y:  11.21, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: b03_red, x:  -4.57, y:  13.12, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: b04_grn, x:  -6.65, y:  13.16, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: b05_grn, x:  -6.70, y:  14.82, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: b06_red, x:  -5.10, y:  14.89, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: b07_red, x:  -1.87, y:  15.14, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: b08_red, x:  -3.75, y:  16.06, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: b09_grn, x:  -5.58, y:  17.02, beacon: flash_green, up_beacon: false}
  - {type: robobuoy, name: b10_red, x:  -4.36, y:  17.52, beacon: flash_red,   up_beacon: false}
  - {type: robobuoy, name: b11_exit, x:  -5.18, y:  19.85, beacon: steady_blue, up_beacon: false}
