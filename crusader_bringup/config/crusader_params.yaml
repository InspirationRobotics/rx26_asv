# ============================================================================
# Crusader — SINGLE SOURCE OF TRUTH for all ROS-side parameters.
#
# Standard ROS 2 parameter-file format: pass to launch via
#     parameters=[os.path.join(pkg_share, "config", "crusader_params.yaml")]
# or per-node:  ros2 run ... --ros-args --params-file config/crusader_params.yaml
#
# Node code loads THIS file for its declaration defaults (api/common/config.py),
# so a code default can never drift from the file the launch system loads.
#
# Parameter posture (enforced in code via ParameterDescriptor):
#   [RO] read_only — safety/structural; `ros2 param set` is REJECTED; change
#        here + restart the node (rebuild NOT required, params load at start).
#   [DYN] dynamic — accepted at runtime via `ros2 param set`, range-validated.
#        Every parameter in this file is currently [RO]: the whole stack is
#        safety plumbing, and nothing here is a test-day tuning knob.
#
# ---------------------------------------------------------------------------
# TWO HARD FORMAT RULES — rcl's parser is stricter than PyYAML. Break either and
# EVERY node in the launch dies at rclpy.init() with "Couldn't parse params
# file", before a single line of node code runs (this happened on the boat on
# 2026-07-29 and grounded the whole stack, LEDs included):
#
#   1. NO YAML anchors/aliases (&name / *name). rcl_yaml_param_parser rejects
#      them outright — it is a token-level parser, not a YAML document loader.
#      Values that MUST stay equal across sections are therefore written out
#      LITERALLY and pinned by tests/test_config_shared.py instead. If you
#      change one, change every copy the test names.
#   2. EVERY top-level key must be a node name whose only child is
#      `ros__parameters:`. A bare scalar at top level is what produced
#      "Cannot have a value before ros__parameters". That is why the `shared`
#      block below — which is documentation, not a real node — still carries a
#      `ros__parameters:` level: no node is named `shared`, so rcl parses the
#      section, matches it to nothing, and ignores it.
#
# tests/test_config_shared.py enforces both rules in CI. Do not "tidy" this file
# back into anchors.
# ============================================================================

# Canonical values for anything duplicated below. NOT a real node (see rule 2) —
# this section is the single source of truth by convention + test, and is never
# loaded by any running node.
shared:
  ros__parameters:
    # age at which a /crsd/pose sample stops being usable. telemetry_bridge uses
    # it to decide when to STOP republishing a dead MAVLink stream; any future
    # consumer must use the same number to decide when to stop acting on the
    # last pose it saw. One value because a consumer trusting a pose longer than
    # the bridge vouches for it is exactly the frozen-pose failure this guards
    # against.
    pose_timeout_s: 1.0

telemetry_bridge:
  ros__parameters:
    mav_endpoint: "udp:127.0.0.1:14551"   # [RO] MAVProxy rebroadcast, never serial
    drop_channel: 7                        # [RO] autonomy-drop RC channel (1..18)
    drop_threshold: 1700                   # [RO] us; crossing trips the latch
    drop_invert: false                     # [RO]
    rc_stale_timeout: 1.0                  # [RO] s without RC -> trip
    stream_timeout_s: 1.0                  # [RO] = shared.pose_timeout_s; s
                                           #      before a stale MAVLink stream
                                           #      stops being republished

# ---- LED status stack ----
led_node:
  ros__parameters:
    port: "/dev/crsd-led"                  # [RO] udev symlink (tools/udev), not by-id
    baud: 115200                           # [RO] must match firmware/LED.ino Serial.begin
    reconnect_s: 3.0                       # [RO] serial reconnect retry period [s]

pixhawk_led_status_node:
  ros__parameters:
    estop_channel: 7                       # [RO] SB e-stop switch channel (RC reference)
    estop_threshold: 1200                  # [RO] us; below = e-stopped (RC loss reads 0)
    autonomy_hold_s: 1.0                   # [RO] stay GREEN this long after last autonomy beat
    rate_hz: 5.0                           # [RO] LED state evaluation rate

# ---- Sensor drivers ----
# oakd_publisher RUNS IN THE SENSOR CONTAINER, not `asv` (which has no depthai by
# design). It still reads this file: one params file for the boat, whichever
# container a node lives in. That means the sensor container must have
# crusader_bringup built in its workspace, or $CRUSADER_PARAMS pointed at this
# file — crusader_common/config.py resolves it in that order and falls back to
# the source tree, which the mounted repo satisfies.
#
# The image geometry is not a preference: depth is aligned to the RGB camera and
# both are emitted at 1920x1200 / isp_denominator, so consumers may use the RGB
# intrinsics on the depth image and read depth at an RGB pixel. Changing
# isp_denominator changes every downstream pixel-space threshold.
oakd_publisher:
  ros__parameters:
    rgb_topic: "oak/rgb"                   # [RO] relative name; namespace/remap moves the pair
    depth_topic: "oak/depth"               # [RO] relative name; 16UC1 millimetres
    frame_id: "oak_rgb_camera_optical_frame"  # [RO] shared by both images (depth is aligned)
    fps: 30.0                              # [RO] camera frame rate [Hz]
    isp_denominator: 3                     # [RO] 1/N of 1920x1200; 3 -> 640x400 (stereo-native)
    sync_threshold_ms: 50                  # [RO] max RGB/depth gap the device Sync will pair
    subpixel: true                         # [RO] finer far-range depth
    lr_check: true                         # [RO] left/right check; rejects occlusions
    poll_period_s: 0.01                    # [RO] output-queue poll; keep well under 1/fps
    queue_size: 4                          # [RO] device output queue depth (non-blocking)
    health_period_s: 5.0                   # [RO] warn if no frames arrived since last check

# buoy_detector OWNS THE SAME CAMERA as oakd_publisher — the OAK-D admits one
# client, so exactly one of the two runs at a time. It publishes detections, not
# frames: a few hundred bytes per frame instead of 1.28 MB, which is the point.
# The camera block below is duplicated from oakd_publisher and MUST stay equal to
# it (rcl forbids YAML anchors; tools/scripts/check_config.py pins the pair) —
# the two nodes have to produce identical geometry or a range measured under one
# does not mean the same thing under the other.
buoy_detector:
  ros__parameters:
    engine: "/root/robotx_ws/models/buoy_v16.engine"   # [RO] TensorRT engine
    labels:                                # [RO] IN ENGINE ORDER — a wrong order
                                           #      silently mislabels every buoy
      - "black_buoy"
      - "black_cross"
      - "black_target_boat"
      - "black_triangle"
      - "blue_buoy"
      - "green_buoy"
      - "green_light_buoy"
      - "green_pole_buoy"
      - "red_buoy"
      - "red_light_buoy"
      - "red_pole_buoy"
      - "yellow_buoy"
      - "yellow_target_boat"
    conf_min: 0.40                         # [RO] publish above this; consumers
                                           #      re-threshold for their own use
    imgsz_height: 352                      # [RO] engine input height
    imgsz_width: 640                       # [RO] engine input width
    range_min_m: 0.30                      # [RO] depth below this is invalid
    range_max_m: 25.0                      # [RO] depth above this is invalid
    min_depth_samples: 5                   # [RO] valid pixels needed to range a box
    frame_id: "camera_link"                # [RO] REP-103 body axes: x fwd, y left, z up
    detections_topic: "oak/detections"     # [RO] Detection3DArray, every frame
    publish_frames: false                  # [RO] BRING-UP ONLY: +38 MB/s at 30fps
    rgb_topic: "oak/rgb"                   # [RO] only used if publish_frames
    depth_topic: "oak/depth"               # [RO] only used if publish_frames
    fps: 30.0                              # [RO] = oakd_publisher.fps
    isp_denominator: 3                     # [RO] = oakd_publisher.isp_denominator
    sync_threshold_ms: 50                  # [RO] = oakd_publisher.sync_threshold_ms
    subpixel: true                         # [RO] = oakd_publisher.subpixel
    lr_check: true                         # [RO] = oakd_publisher.lr_check
    poll_period_s: 0.01                    # [RO] output-queue poll period [s]
    queue_size: 4                          # [RO] device output queue depth
    health_period_s: 5.0                   # [RO] rate/health log period [s]
    stream_enable: true                    # [RO] annotated MJPEG view over HTTP;
                                           #      frames are only drawn while a
                                           #      browser is actually connected
    stream_port: 8080                      # [RO] same default as tools/oak_view.py —
                                           #      they cannot both bind it, and they
                                           #      are never both useful at once
    stream_quality: 60                     # [RO] JPEG quality for that view

# ---- rc_heartbeat_watchdog: force-disarm on RC-transmitter link loss (safety) ----
# Consumes telemetry_bridge topics (/crsd/rc_channels, /crsd/fcu_status) and routes
# a force-disarm back through the bridge (/crsd/force_disarm) — no own MAVLink conn.
# Complements ArduPilot FS_THR/FS_GCS and the hardware SB e-stop (defense in depth).
# All params [RO]: safety config, change here + restart. rc_channel/reset_channel
# share ch7 (the SB switch) with telemetry_bridge/pixhawk_led as read-only inputs.
rc_heartbeat_watchdog:
  ros__parameters:
    heartbeat_timeout: 1.0                 # [RO] s of stale monitored-channel PWM -> RC link lost
    rc_channel: 7                          # [RO] channel whose valid PWM is the RC heartbeat
    min_valid_pwm: 900                     # [RO] us; below = no pulses (RC loss reads 0)
    require_armed: true                    # [RO] only force-disarm when armed
    link_timeout: 3.0                      # [RO] s without any bridge topic -> gateway deemed down
    enable_latch: false                    # [RO] true = hold kill until RC reset toggle clears it
    reset_channel: 7                       # [RO] channel whose low->high toggle clears the latch
    reset_low_pwm: 1300                    # [RO] us; reset switch "low" below this
    reset_high_pwm: 1700                   # [RO] us; reset switch "high" above this
