# ============================================================================
# Crusader — SINGLE SOURCE OF TRUTH for all ROS-side parameters.
#
# Standard ROS 2 parameter file (launch: parameters=[...]; one node:
# --ros-args --params-file). Node code also loads it for its declaration
# defaults (crusader_common/config.py), so a code default cannot drift.
#
# Posture, enforced in code via ParameterDescriptor:
#   [RO]  read_only — `ros2 param set` is REJECTED; change here + restart the
#         node (no rebuild: params load at start).
#   [DYN] dynamic — accepted at runtime via `ros2 param set`, range-validated.
#
# ---------------------------------------------------------------------------
# TWO HARD FORMAT RULES — rcl's parser is stricter than PyYAML. Break either and
# EVERY node in the launch dies at rclpy.init() with "Couldn't parse params
# file" — the whole stack grounded, LEDs included:
#   1. NO YAML anchors/aliases (&name / *name): rcl parses tokens, not YAML.
#      Values that MUST stay equal across sections are written out LITERALLY;
#      check_config.py pins them — change every copy it names.
#   2. EVERY top-level key is a node whose only child is `ros__parameters:`
#      (else "Cannot have a value before ros__parameters"). Hence `shared`
#      carries that level too; no node is named `shared`, so rcl ignores it.
# tools/scripts/check_config.py enforces both. Do not "tidy" back into anchors.
# ============================================================================

# Canonical values for anything duplicated below. NOT a real node (rule 2).
shared:
  ros__parameters:
    # Age at which a /crsd/pose sample stops being usable: telemetry_bridge stops
    # republishing a dead MAVLink stream, and every consumer stops acting on the
    # last pose it saw. One value: a consumer trusting a pose longer than the
    # bridge vouches for it is the frozen-pose failure this guards against.
    pose_timeout_s: 1.0

    # THE flight modes that mean "we are driving, not the pilot". One list, so
    # what the boat obeys (telemetry_bridge, bt_runner), shows (mast GREEN —
    # mandatory per 5.3.1) and reports (ocs_client STATE_AUTO) stay one fact.
    # Uppercase: mode_string_v10 returns "GUIDED". LOITER gets ArduPilot's simple
    # avoidance only; BendyRuler/Dijkstra runs in AUTO, GUIDED and RTL alone.
    autonomous_modes: ["GUIDED", "AUTO", "LOITER", "RTL"]

telemetry_bridge:
  ros__parameters:
    mav_endpoint: "udp:127.0.0.1:14551"   # [RO] MAVProxy rebroadcast, never serial
    fcu_sysid: 2                           # [RO] the autopilot's SYSID_THISMAV; Ekko is 1
    # The AUTONOMY INTERLOCK, = shared.autonomous_modes: the pilot leaving these
    # modes on SC is the autonomy drop. ArduPilot independently ignores
    # SET_POSITION_TARGET_* outside GUIDED/AUTO/RTL.
    autonomous_modes: ["GUIDED", "AUTO", "LOITER", "RTL"]   # [RO]
    mode_timeout_s: 1.0                    # [RO] s without HEARTBEAT before the
                                           #      mode counts as UNKNOWN, which
                                           #      is never autonomous. Fails closed.
    # --- RC drop latch: governs the RC-OVERRIDE path only ---
    # NOT ch7: that is the SB arm/e-stop switch (OPERATIONS.md §6: up ~1995 =
    # arm), so arming would trip this >= drop_threshold latch and block every
    # override. ch9 has no switch yet (SD proposed): it reads ~1500 and NEVER
    # TRIPS, so today the kills are SC (mode) and SB (e-stop). The GUIDED path
    # is gated on the MODE, not this latch.
    drop_channel: 9                        # [RO] autonomy-drop RC channel (1..18)
    drop_threshold: 1700                   # [RO] us; crossing trips the latch
    drop_invert: false                     # [RO]
    rc_stale_timeout: 1.0                  # [RO] s without RC -> trip
    stream_timeout_s: 1.0                  # [RO] = shared.pose_timeout_s; s
                                           #      before a stale MAVLink stream
                                           #      stops being republished
    # --- the water pump: /crsd/pump_cmd -> DO_REPEAT_SERVO (crusader_fcu/pump_core) ---
    # 0 (no pump path, every burst refused) until docs/G7_pump_bench.md is done;
    # then the Pixhawk output with SERVOn_FUNCTION = 50 + pump_rc_channel (RCIN10
    # = 60) and SERVOn_TRIM = pump_off_pwm: the autopilot ends each burst at TRIM.
    pump_servo_channel: 0                  # [RO] Pixhawk output 1..16; 0 = none
    pump_rc_channel: 10                    # [RO] the pilot's pump switch. NOT 9:
                                           #      that is drop_channel above
    pump_on_pwm: 2000                      # [RO] us; MEASURE on the bench (G7)
    pump_off_pwm: 1000                     # [RO] us; MUST equal SERVOn_TRIM
    pump_max_burst_s: 1.0                  # [RO] squirt_cal fires 0.2-0.5 s
    pump_min_gap_s: 1.0                    # [RO] s from one burst's end to the next
    pump_allow_disarmed: false             # [RO] bench only, and only by a -p
                                           #      override on the command line
    # --- GUIDED heading+speed: /crsd/guided_heading_speed -> SET_ATTITUDE_TARGET ---
    # The fixed-nozzle shot's station keeping (crusader_fcu/guided_hs_core).
    # Gated by the MODE (GUIDED only) AND the drop latch; a stop is sent when
    # commands go quiet for hs_deadman_s or the latch trips.
    hs_max_speed_mps: 0.4                  # [RO] clamp, either direction
    hs_wp_speed_mps: 1.0                   # [RO] = WP_SPEED: thrust 1.0 means this
                                           #      (check_config pins it to the baseline)
    hs_deadman_s: 0.5                      # [RO] s without a command -> one stop
    # /crsd/rc_override (software on the sticks; the fixed-nozzle shot strafes,
    # and only MANUAL strafes on this OmniX hull): forwarded only in
    # override_modes on override_channels (SB ch7, SC ch8 and the pump stay the
    # pilot's), clamped, released after override_deadman_s. crusader_fcu/override_core.py.
    override_channels: [1, 3, 4]           # [RO] steer, throttle, lateral
    override_max_us: 150                   # [RO] us about 1500 (dp_hold ran 120)
    override_deadman_s: 0.5                # [RO] s without an override -> release
    override_modes: ["MANUAL"]             # [RO]
    estop_channel: 7                       # [RO] = pixhawk_led_status_node's:
    estop_threshold: 1200                  # [RO]   SB, below = e-stop or RC lost.
                                           #        The e-stop stops MOTORS, not
                                           #        pass-through outputs, so the
                                           #        bridge sends the pump OFF

# ---- Task 3 fixed nozzle: the wall range (crusader_perception/wall_range_node) ----
# NOT in core.launch.py until it has run on the boat. The LiDAR extrinsic and the
# waterline come from lidar_cluster_node's section, not from here: one sensor,
# one mounting.
wall_range_node:
  ros__parameters:
    cloud_topic: "/livox/lidar"            # [RO] livox container's PointCloud2
    wall_topic: "/crsd/wall_range"         # [RO] WallRange out, every sweep
    frame_id: "base_link"                  # [RO]
    attitude_timeout_s: 0.5                # [RO] older = fit unlevelled
    health_period_s: 2.0                   # [RO]
    sector_deg: 40.0                       # [RO] half-angle ahead for the wall
    finger_sector_deg: 90.0                # [RO] fingers are beside the boat
    r_min: 0.3                             # [RO] m, horizontal, from the body origin
    r_max: 4.0                             # [RO]
    z_min_above_water: 0.03                # [RO] m; the band that is not water
    z_max_above_water: 1.5                 # [RO]
    tol_m: 0.03                            # [RO] RANSAC inlier distance
    iters: 200                             # [RO]
    max_points: 4000                       # [RO] RANSAC scores a subsample
    min_inliers: 40                        # [RO]
    min_span_m: 0.4                        # [RO] this much wall, along it
    max_angle_deg: 35.0                    # [RO] a wall more oblique is not ahead
    finger_depth_m: 2.5                    # [RO] fingers within this of the wall
    finger_min_off_m: 0.25                 # [RO] a finger's inner edge, sideways
    finger_max_off_m: 1.5                  # [RO]
    finger_min_points: 15                  # [RO]
    finger_quantile: 0.1                   # [RO] inner edge = this quantile

# ---- Task 3 fixed nozzle: the calibration tool (tools/squirt_cal) ----
# A bench tool, not a node in the launch file: python3 tools/squirt_cal/squirt_cal.py
# Every key must be here (squirt_core.load_config refuses unknown and missing).
squirt_cal:
  ros__parameters:
    port: 8094                             # the phone opens http://<jetson>:8094
    log_dir: "/root/robotx_ws/logs/squirt_cal"   # bind-mounted: one dir per session
    snapshot_url: "http://127.0.0.1:8080/stream/raw"   # "" = no camera frames
    wall_range_topic: "/crsd/wall_range"   # = wall_range_node.wall_topic
    pump_rc_channel: 10                    # = telemetry_bridge.pump_rc_channel
    pump_on_threshold_us: 1700             # pilot switch reads ON above this
    burst_choices_s: [0.2, 0.3, 0.5]
    burst_default_s: 0.3
    arm_timeout_s: 15.0                    # give up waiting for steady
    min_gap_s: 2.0                         # between shots
    verdict_after_s: 0.8                   # the water's flight + a look
    pilot_burst_max_s: 3.0
    range_window_s: 0.5                    # pre-fire range = median over this
    range_max_age_s: 0.5
    step_m: 0.1                            # search step until bracketed
    on_range_tol_m: 0.02
    min_hits_for_band: 3
    square_tol_deg: 3.0
    steady_rate_max_dps: 4.0               # "steady": rates, band, hands off
    steady_band_deg: 1.5
    steady_hold_s: 0.5
    steady_mean_s: 5.0
    sticks_quiet_s: 1.5
    stick_tol_us: 25
    att_min_hz: 10.0                       # needs SR0_EXTRA1 >= 10 (30 intended)
    # The starting guess only. MEASURE these (docs/G7_pump_bench.md, Phase 0):
    nozzle_x_m: 0.45                       # nozzle ahead of the body origin
    nozzle_height_m: 0.4                   # above the water
    nozzle_elev_deg: 45.0
    nozzle_range_m: 3.0                    # level range at nozzle_elev_deg
    deck_height_m: 0.3                     # face panel bottom above the water
    face_setback_m: 0.0                    # panel behind the edge the LiDAR ranges
    branch: "near"                         # near = rising part of the arc
    target_ids: ["ul_top", "lr_top"]
    target_labels: ["Upper-left window, top edge", "Lower-right window, top edge"]
    target_edge_mm: [895.0, 645.0]         # above the face panel's bottom edge
    target_lat_m: [0.22, -0.23]            # window centre from face centre, + left

# ---- LED status stack ----
led_node:
  ros__parameters:
    port: "/dev/crsd-led"                  # [RO] udev symlink (tools/udev), not by-id
    baud: 115200                           # [RO] must match firmware/LED.ino Serial.begin
    reconnect_s: 3.0                       # [RO] serial reconnect retry period [s]

led_status_node:
  ros__parameters:
    autonomous_modes: ["GUIDED", "AUTO", "LOITER", "RTL"]   # [RO] = telemetry_bridge's
    estop_channel: 7                       # [RO] SB e-stop switch channel (RC reference)
    estop_threshold: 1200                  # [RO] us; below = e-stopped (RC loss reads 0)
    autonomy_hold_s: 1.0                   # [RO] stay GREEN this long after last autonomy beat
    rate_hz: 5.0                           # [RO] LED state evaluation rate

# ---- Perception: the OAK-D nodes ----
# They run in `asv` (it carries depthai) and are not in core.launch.py: they
# contend for the one OAK-D, so which one runs is an operator choice.
# Depth is aligned to RGB and both come out at 1920x1200 / isp_denominator, so
# consumers use the RGB intrinsics on the depth image. Changing isp_denominator
# changes every downstream pixel-space threshold.
oakd_publisher:
  ros__parameters:
    rgb_topic: "oak/rgb"                   # [RO] relative name; namespace/remap moves the pair
    depth_topic: "oak/depth"               # [RO] relative name; 16UC1 millimetres
    frame_id: "oak_rgb_camera_optical_frame"  # [RO] shared by both images (depth is aligned)
    fps: 15.0                              # [RO] camera frame rate [Hz]
    isp_denominator: 3                     # [RO] 1/N of 1920x1200; 3 -> 640x400 (stereo-native)
    poll_period_s: 0.01                    # [RO] output-queue poll; keep well under 1/fps
    queue_size: 4                          # [RO] device output queue depth (non-blocking)
    health_period_s: 5.0                   # [RO] warn if no frames arrived since last check

# buoy_detector OWNS THE SAME CAMERA as oakd_publisher (one client at a time).
# It publishes detections, not frames: a few hundred bytes instead of 1.28 MB.
# Its camera block MUST equal oakd_publisher's (check_config.py), or a range
# measured under one means something else under the other.
buoy_detector:
  ros__parameters:
    engine: "/root/robotx_ws/models/buoy_v16.engine"   # [RO] TensorRT engine
    labels:                                # [RO] IN ENGINE ORDER — a wrong order
                                           #      silently mislabels every buoy
      - "black_buoy"
      - "black_cross"
      - "black_target_boat"
      - "black_triangle"
      - "blue_buoy"
      - "green_buoy"
      - "green_light_buoy"
      - "green_pole_buoy"
      - "red_buoy"
      - "red_light_buoy"
      - "red_pole_buoy"
      - "yellow_buoy"
      - "yellow_target_boat"
    conf_min: 0.40                         # [RO] publish above this; consumers
                                           #      re-threshold for their own use
    imgsz_height: 352                      # [RO] engine input height
    imgsz_width: 640                       # [RO] engine input width
    range_min_m: 0.30                      # [RO] depth below this is invalid
    range_max_m: 25.0                      # [RO] depth above this is invalid
    min_depth_samples: 5                   # [RO] valid pixels needed to range a box
    frame_id: "camera_link"                # [RO] REP-103 body axes: x fwd, y left, z up
    detections_topic: "crsd/oak/detections"     # [RO] Detection3DArray, every frame
    publish_frames: false                  # [RO] BRING-UP ONLY: +38 MB/s at 30fps
    rgb_topic: "oak/rgb"                   # [RO] only used if publish_frames
    depth_topic: "oak/depth"               # [RO] only used if publish_frames
    fps: 15.0                              # [RO] = oakd_publisher.fps
    isp_denominator: 3                     # [RO] = oakd_publisher.isp_denominator
    poll_period_s: 0.01                    # [RO] output-queue poll period [s]
    queue_size: 4                          # [RO] device output queue depth
    health_period_s: 5.0                   # [RO] rate/health log period [s]
    stream_enable: true                    # [RO] annotated MJPEG view over HTTP;
                                           #      frames are only drawn while a
                                           #      browser is actually connected
    stream_port: 8080                      # [RO] = tools/oak_view.py's: never
                                           #      both bound, never both useful
    stream_quality: 60                     # [RO] JPEG quality for that view

# ---- lidar_cluster_node: MID360 point cloud -> 3D object clusters ----
# Consumes the livox container's /livox/lidar; opens no device itself.
#
# THE EXTRINSIC IS BENCH-CONFIRMED (docs/G2_lidar_orientation.md): mounted
# upside down, the raw frame is x forward, y STARBOARD, z down, so both signs
# negate into REP-103. [RO]: a live-tunable mounting silently invalidates every
# position already on the map. Re-run G2 after any remount.
lidar_cluster_node:
  ros__parameters:
    cloud_topic: "/livox/lidar"            # [RO] livox container's PointCloud2
    clusters_topic: "crsd/lidar_clusters"  # [RO] Cluster3DArray, every window
    frame_id: "base_link"                  # [RO] REP-103: x fwd, y left, z up
    # -- extrinsic [RO]: sensor -> body. See docs/G2 --
    lidar_sign_y: -1.0                     # [RO] raw +y is starboard
    lidar_sign_z: -1.0                     # [RO] mounted upside down
    lidar_x: 0.32                          # [RO] m forward of geometry centre
    lidar_y: 0.05                          # [RO] m to PORT of centreline
    lidar_z: 0.52                          # [RO] m above the hull-bottom datum.
                                           #      Draft is 0.24 m, so the sensor
                                           #      sits only 0.28 m ABOVE THE
                                           #      WATERLINE (wave clearance cost:
                                           #      Resources.md).
    # -- self-return filters [DYN], applied in the SENSOR frame --
    r_min: 0.5                             # [DYN] clear sphere around the sensor;
                                           #       mount, cabling, deck beneath it
    fov_deg: 180.0                         # [DYN] forward sector only — the hull
                                           #       blocks the view aft of the beam,
                                           #       so returns behind it are the boat
    # -- levelled-frame gates [DYN] --
    water_z: 0.24                          # [DYN] MEASURED waterline above the
                                           #       hull-bottom datum (G2 step 4).
                                           #       Most of the FOV is water: set
                                           #       too low, water returns reach
                                           #       clustering. Anything under
                                           #       water_margin above the surface
                                           #       is dropped by design — lower the
                                           #       margin, not water_z, to see
                                           #       very low debris.
    water_margin: 0.15                     # [DYN] keep points this far above water
    z_ceiling: 4.0                         # [DYN] above this is sky/rain
    r_max: 10.0                            # [DYN] horizontal range ceiling [m].
                                           #       POOL VALUE: at 40 m a pool's
                                           #       walls, deck and room become 100+
                                           #       permanent tracks at 15-28 m.
                                           #       ON OPEN WATER RAISE IT to 25-40:
                                           #       10 m is inside the camera's 25
                                           #       and makes the fusion one-sided.
                                           #       ros2 param set /lidar_cluster_node
                                           #           r_max 40.0
    # -- voxel-grid DBSCAN [DYN] --
    # eps stays SMALL, growing only gently with range: a buoy's returns are ~0.3 m
    # apart at every range, while the neighbourhood volume grows as eps^3 and
    # sweeps in proportionally more noise.
    leaf_size: 0.15                        # [DYN] voxel edge [m]
    eps_0: 0.30                            # [DYN] neighbourhood radius at eps_r_ref
    eps_r_ref: 15.0                        # [DYN] range where eps_0 applies [m]
    max_rings: 2                           # [DYN] cap on adaptive eps, in voxels
    min_density_points: 6                  # [DYN] raw points in the neighbourhood
                                           #       before a voxel may seed a cluster
    min_points: 5                          # [DYN] points needed to emit a cluster
    max_extent_m: 8.0                      # [DYN] bigger = shoreline, not an object
    # -- accumulation + freshness [DYN] --
    # A 0.3 m buoy returns ~37 points per sweep at 5 m, 9 at 10 m, 2 at 20 m:
    # 1 sweep reaches ~10 m, 5 reach ~20 m. Stacking works because Livox's
    # non-repetitive pattern adds NEW coverage each sweep.
    accumulate_sweeps: 5                   # [DYN] 10 Hz sweeps -> ~0.5 s window
    attitude_timeout_s: 1.0                # [DYN] stale -> cluster unlevelled
    pose_timeout_s: 1.0                    # [DYN] stale -> single sweep, no
                                           #       accumulation (cannot compensate)
    health_period_s: 5.0                   # [DYN] JSON stats publish period
    # -- navigation cloud: the Nav2 costmap's LiDAR input (docs/nav2_avoidance_spec.md
    #    section 6). Every point in a cluster of >= min_points, levelled and voxel-
    #    thinned, INCLUDING clusters over max_extent_m: a dock is not a trackable
    #    object, but the hull still must not hit it. --
    nav_cloud_enable: true                 # [DYN] THE POOL SWITCH. false publishes
                                           #       EMPTY clouds: the costmap stays
                                           #       current and marks nothing.
                                           #       Pool/indoor: false (with r_max
                                           #       10) — walls get marked lethal
                                           #       and goals near them become
                                           #       unreachable. Open water: true,
                                           #       r_max 25-40. Live, or the GCS
                                           #       Tuning tab.
    nav_cloud_topic: "/crsd/nav/obstacle_cloud"  # [RO] PointCloud2 out, sensor-data QoS
    nav_cloud_frame: "base_footprint"      # [RO] = nav_frames_node.base_frame.
                                           #      Stamped with RECEIPT time;
                                           #      WITHHELD while attitude is stale
                                           #      (costmap goes non-current,
                                           #      planned legs hold)
    nav_cloud_leaf_m: 0.10                 # [DYN] voxel edge, one centroid each;
                                           #       0.05-0.5. Costmap resolution is 0.1

# ---- proximity_bridge: LiDAR clusters -> OBSTACLE_DISTANCE for the autopilot ----
# OPTIONAL, and NOT the avoidance mechanism: that is the Nav2 planner called
# from bt_runner (docs/nav2_avoidance_spec.md). ArduPilot's simple avoidance is
# at most a backstop and is off in the baseline: PRX1_TYPE 0, so the
# AVOID_ENABLE=3 / AVOID_MARGIN=2.0 that are set have nothing feeding them.
# DO NOT turn it on to "help" the planner: with AVOID_MARGIN 2.0 ArduRover STOPS
# the boat inside the planner's 0.8-2 m band and in the Task 3 berth.
#
# AUTOPILOT SIDE, which must be set or none of this does anything:
#   PRX1_TYPE = 2   MAVLink proximity source; at 0 OBSTACLE_DISTANCE is ignored
#                   and the viewer stays empty.
#   AVOID_BEHAVE    IGNORE IT: a COPTER parameter. Rover always stops before
#                   objects in every mode except MANUAL; there is no Slide.
#   OA_TYPE = 1     BendyRuler — the ONLY thing that routes AROUND obstacles,
#                   and only in AUTO, GUIDED and RTL. (OA_BR_TYPE = 1,
#                   horizontal, is Rover's only option.)
proximity_bridge:
  ros__parameters:
    clusters_topic: "crsd/lidar_clusters"  # [RO] = lidar_cluster_node.clusters_topic
    output_topic: "crsd/obstacle_distance" # [RO] telemetry_bridge puts it on the wire
    send_rate_hz: 5.0                      # [RO] clusters arrive at 10 Hz; 5 is
                                           #      plenty and halves the load on
                                           #      the USB link a param download
                                           #      is known to saturate
    fov_deg: 180.0                         # [RO] = lidar_cluster_node.fov_deg.
                                           #      The hull blocks aft; those
                                           #      sectors go out as NO READING,
                                           #      never as a near return
    increment_deg: 5.0                     # [RO] 72 sectors x 5 deg = 360.
                                           #      ArduPilot consolidates to 8
                                           #      sectors of 45 deg anyway
    min_range_m: 0.5                       # [RO] = lidar_cluster_node.r_min
    max_range_m: 40.0                       # [RO] lidar_cluster_node.r_max's open-water value
    min_half_deg: 1.0                      # [RO] floor on painted width so a
                                           #      distant buoy still fills a sector
    cluster_timeout_s: 1.0                 # [RO] stale clusters -> emit NOTHING.
                                           #      Repeating the last map claims
                                           #      the world still looks like that
    health_period_s: 5.0                   # [RO]

# ---- Nav2 avoidance: nav_frames_node — the datum, and TF map -> base_footprint ----
# docs/nav2_avoidance_spec.md section 2. TF `map`, bt_runner's east/north frame
# and every HazardArray coordinate are ONE equirectangular ENU plane on one
# datum, chosen here alone: published latched on /crsd/datum, adopted by
# bt_runner. Started by crusader_nav's nav.launch.py before bt_runner; NOT in
# core.launch.py.
# "param" is restart-stable: use it in competition and the sim (nav.launch.py
# datum_source:=param datum_lat:=.. datum_lon:=..). "first_fix" (the first
# /crsd/pose fix) is NOT respawned: a restart would pick a new datum and shift
# the map under a running bt_runner. Competition day: open decision D1 in the spec.
nav_frames_node:
  ros__parameters:
    datum_source: "first_fix"              # [RO] "param" or "first_fix"
    datum_lat: 0.0                         # [RO] used when datum_source is "param".
                                           #      (0, 0) is a CONFIG ERROR there: the
                                           #      default is not a datum
    datum_lon: 0.0                         # [RO]
    pose_topic: "/crsd/pose"               # [RO] LatLonHead in
    datum_topic: "/crsd/datum"             # [RO] = bt_runner_node.nav_datum_topic
    map_frame: "map"                       # [RO] = nav2 global_costmap global_frame
    base_frame: "base_footprint"           # [RO] = nav2 robot_base_frame and
                                           #      lidar_cluster_node.nav_cloud_frame.
                                           #      Levelled base_link at the hull-bottom
                                           #      datum (REP-120 note in the README)
    health_period_s: 1.0                   # [DYN] /crsd/nav/frames_health JSON

# ---- World model: target_tracker — detections + pose -> earth-anchored targets ----
# Consumes oak/detections (camera_link), crsd/lidar_clusters (base_link),
# /crsd/pose and /crsd/attitude; publishes crsd/world_targets. Opens no device
# and commands nothing. Not in core.launch.py.
#
# CAMERA EXTRINSIC (Resources.md): TRANSLATION MEASURED against the LiDAR's
# hull-bottom datum, so camera and LiDAR z of one buoy agree. ORIENTATION NOT
# BENCH-CONFIRMED: zero angles are belief, the kind that got the LiDAR's y-sign
# wrong until G2 — run the same check here. [RO] for the LiDAR's reason.
target_tracker:
  ros__parameters:
    detections_topic: "crsd/oak/detections"     # [RO] = buoy_detector.detections_topic
    clusters_topic: "crsd/lidar_clusters"  # [RO] = lidar_cluster_node.clusters_topic
    targets_topic: "crsd/world_targets"    # [RO] TrackedTargetArray, every tick
    health_topic: "crsd/world_model_health"  # [RO] std_msgs/String (JSON)
    update_rate_hz: 10.0                   # [RO] fuse/track cycle. Slower than
                                           #      the camera ON PURPOSE: one
                                           #      message counts once, and frames
                                           #      ms apart are one vantage point.
    # -- freshness budgets [RO] --
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s; stale
                                           #      -> NO observations ingested
    attitude_timeout_s: 1.0                # [RO] stale -> no observations: no
                                           #      placing without roll/pitch/yaw
    detection_timeout_s: 1.0               # [RO] stale -> LiDAR-only cycles
    cluster_timeout_s: 2.0                 # [RO] stale -> camera-only cycles.
                                           #      The LiDAR window is ~0.5 s, so
                                           #      a 1 s budget would flap.
    # -- camera extrinsic [RO]: camera_link -> base_link. Resources.md, see above --
    cam_x: 0.37                            # [RO] m forward of the body origin
                                           #      (LiDAR is at 0.32 — 5 cm aft)
    cam_y: 0.0                             # [RO] m to PORT; camera is on the
                                           #      centreline, LiDAR is 5 cm port
    cam_z: 0.65                            # [RO] m above the hull-bottom datum
                                           #      (0.41 m above the waterline),
                                           #      the SAME datum as lidar_z
    cam_yaw_deg: 0.0                       # [RO] mount yaw, + = aimed to PORT.
                                           #      ASSUMED, not bench-confirmed.
    cam_pitch_deg: 0.0                     # [RO] mount tilt, + = aimed DOWN.
                                           #      ASSUMED, not bench-confirmed.
    # -- fusion gates [DYN] --
    use_lidar: false                       # [DYN] FUSE LIDAR CLUSTERS AT ALL.
                                           #       false = camera-only: clusters
                                           #       are counted in health, then
                                           #       discarded before fusion.
                                           #       Why false: in a pool or beside
                                           #       a dock an unlabelled cluster is
                                           #       the WALL; it clusters cleanly,
                                           #       survives track_unlabeled and
                                           #       confirm_hits, and with
                                           #       track_timeout_s 0 never leaves.
                                           #       ON OPEN WATER SET IT TRUE, with
                                           #       r_max back at 25-40: stereo
                                           #       range is ~6% systematic + ~4%
                                           #       random (a 25 m buoy sits ~1.5 m
                                           #       long, wanders a metre); LiDAR
                                           #       makes that centimetres.
                                           #       The five gates below are INERT
                                           #       while false. [DYN]: flipping it
                                           #       invalidates nothing on the map.
    fuse_bearing_deg: 6.0                  # [DYN] camera/LiDAR bearing agreement.
                                           #       Wide only for the ASSUMED mount
                                           #       angles (5 cm sensor offset is
                                           #       0.3 deg at 10 m). Tighten toward
                                           #       2-3 deg once a G2-style check
                                           #       confirms the camera's aim.
    fuse_range_m: 4.0                      # [DYN] absolute range-agreement floor
    fuse_range_frac: 0.25                  # [DYN] ... or this fraction of the
                                           #       camera range, whichever is
                                           #       larger — stereo error grows
                                           #       with range, so the gate must too
    min_confidence: 0.50                   # [DYN] above buoy_detector's 0.40:
                                           #       the detector publishes what it
                                           #       saw, the map commits to it
    track_unlabeled: true                  # [RO] keep LiDAR-only clusters: an
                                           #      unnamed obstacle is still an
                                           #      obstacle. INERT while use_lidar
                                           #      is false.
    # -- tracking gates [DYN] --
    assoc_radius_m: 3.0                    # [DYN] world-frame association radius.
                                           #       The most consequential number
                                           #       here: too wide merges a
                                           #       red/green gate pair into one
                                           #       object at the midpoint, too
                                           #       narrow splits one buoy into a
                                           #       new track every few seconds.
                                           #       Watch position_stddev.
    pos_alpha: 0.30                        # [DYN] floor on the position EMA gain
    vel_alpha: 0.20                        # [DYN] velocity EMA gain
    confirm_hits: 3                        # [DYN] sightings before CONFIRMED
    tentative_timeout_s: 3.0               # [DYN] unconfirmed tracks expire fast:
                                           #       one frame of detector noise
                                           #       must not sit on the map
    track_timeout_s: 0.0                   # [DYN] 0 = a CONFIRMED track NEVER
                                           #       expires, so a buoy re-entering
                                           #       the FOV updates its ORIGINAL
                                           #       track, not a second one.
                                           #       > 0 = forget after that many s.
                                           #       AT 0, confirm_hits is the ONLY
                                           #       thing between a wave crest and
                                           #       a permanent phantom — raise it
                                           #       if phantoms accumulate.
    max_tracks: 64                         # [DYN] runaway guard (a shoreline
                                           #       clustering into hundreds)
    # -- colour voting: ONE buoy, many beacon states --
    # The detector names the beacon STATE (side beacons OFF in Task 1 Disruptive;
    # FLASHING 1 s on / 1 s off in lower tiers), so one RoboBuoy is red_buoy one
    # frame and black_buoy the next. Keyed on the label, that is two tracks a
    # metre apart — a phantom obstacle beside a gate buoy. So every label in
    # colour_family_labels associates with every other and colour is decided by
    # VOTES. The UAV supplies it when this tracker cannot (bt_runner fusePassage).
    colour_vote_enable: true               # [DYN] false = same label to
                                           #       associate, plain majority to
                                           #       report
    colour_family_labels:                  # [RO] ONE object type in different
      - "red_buoy"                         #      beacon states. Labels outside
      - "green_buoy"                       #      this list need the same label
      - "black_buoy"                       #      (or one side empty).
      - "flashing_blue_buoy"               #      NOTE the engine's own class is
      - "steady_blue_buoy"                 #      blue_buoy (buoy_detector.labels),
      - "blue_buoy"                        #      listed too so a lit-blue RoboBuoy
                                           #      merges with its own dark frames
    colour_family_shapes:                  # [RO] oak_detector's names are
      - "diamond"                          #      [flash_|off_]<colour>_<shape> or
                                           #      a bare <shape>: each shape is one
                                           #      family; bare/off_ = unlit votes;
                                           #      unknown reports unknown_<shape>
    colour_unlit_labels:                   # [RO] family votes that carry NO
      - "black_buoy"                       #      colour (dark side beacon, or the
                                           #      off half of a flash). Left out
                                           #      of the ratio, so a flashing red
                                           #      buoy (~50% red, ~50% dark)
                                           #      still resolves red
    colour_unknown_label: "unknown_buoy"   # [RO] reported when no lit colour
                                           #      wins. MUST hold no colour word:
                                           #      bt_runner beaconFromLabel()
                                           #      matches the substrings red,
                                           #      green, blue, off, black. Still
                                           #      a track and an obstacle
    colour_min_votes: 5                    # [DYN] a lit colour needs at least
                                           #       this many votes ...
    colour_min_ratio: 0.6                  # [DYN] ... and this share of the LIT
                                           #       votes; a dead heat is unknown
                                           #       whatever this is set to
    health_period_s: 5.0                   # [DYN] JSON stats publish period

# ---- Ground station: the operator's window onto the whole boat ----
# Read-only over ROS: no publishers. Its only outward effects are the node
# processes it spawns and the two power verbs it hands to the HOST helper
# (tools/scripts/crsd_power_helper.py), gated in the page AND re-checked
# server-side: a rule enforced only in JavaScript is decoration.
ground_station:
  ros__parameters:
    port: 8090                             # [RO] clear of the viewers it embeds:
                                           #      8080 = buoy_detector/oak_view,
                                           #      8081 = lidar_view
    bind_host: "0.0.0.0"                   # [RO] must NOT be 127.0.0.1 or the
                                           #      laptop cannot reach it
    targets_topic: "crsd/world_targets"    # [RO] = target_tracker.targets_topic
    clusters_topic: "crsd/lidar_clusters"  # [RO] = lidar_cluster_node.clusters_topic.
                                           #      The RAW input beside the tracks;
                                           #      sent only when the page asks.
    obstacle_topic: "crsd/obstacle_distance"  # [RO] = proximity_bridge.output_topic:
                                           #      the 72 sectors EXACTLY as sent
                                           #      to the autopilot. Map vs QGC's
                                           #      PRX1 view differ: the fault is
                                           #      between here and the FCU. They
                                           #      agree but the clusters differ:
                                           #      proximity_bridge.
    clusters_timeout_s: 2.0                # [RO] stale -> the layer greys out.
                                           #      Longer than pose: the LiDAR
                                           #      window is ~0.5 s and a 1 s
                                           #      budget would flap.
    obstacle_timeout_s: 2.0                # [RO] proximity_bridge sends at 5 Hz
    nav_leg_topic: "/crsd/nav/leg_status"  # [RO] = bt_runner's leg status (JSON,
                                           #      docs/nav2_avoidance_spec.md 4.3):
                                           #      the path, carrot and goal drawn.
    nav_leg_timeout_s: 2.0                 # [DYN] stale -> the path is BLANK, never
                                           #       the last one. bt_runner sends up
                                           #       to 2 Hz during a leg, once per
                                           #       change when idle, so an idle
                                           #       boat's path disappears.
    tools_dir: "/root/robotx_ws/src/rx26_asv/tools"   # [RO] the viewer scripts,
                                           #      INSIDE the asv container. Wrong
                                           #      path = viewer tabs fail with a
                                           #      file-not-found, nothing else.
    power_socket: "/run/crsd-power.sock"   # [RO] host helper socket, bind-mounted
                                           #      into this container: a container
                                           #      CANNOT power off the Jetson on
                                           #      its own (crsd_power_helper).
    allow_power: true                      # [RO] master switch for the power tab.
                                           #      false on any machine where a
                                           #      browser must never halt the host.
    disk_path: "/"                         # [RO] filesystem reported as free: the
                                           #      CONTAINER's view, so the tab
                                           #      prints the path it measured.
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s
    attitude_timeout_s: 1.0                # [RO] stale -> attitude readout greys
    status_timeout_s: 1.0                  # [RO] mode/armed readout. ALSO the
                                           #      power interlock: unknown armed
                                           #      state locks power — a missing
                                           #      FcuStatus usually means the
                                           #      bridge is down, which is not
                                           #      evidence the boat is safe.
    targets_timeout_s: 3.0                 # [RO] stale -> map says so
    poll_period_s: 0.2                     # [RO] browser -> /state. 5 Hz is
                                           #      ~0.5 Mbps with a full trail
    graph_period_s: 1.0                    # [DYN] how often the ROS node graph is
                                           #       scanned. Per browser poll would
                                           #       scale discovery traffic with
                                           #       the number of viewers.
    trail_length: 600                      # [DYN] wake points kept
    trail_min_move_m: 0.5                  # [DYN] distance-gated, not time-gated
    log_capacity: 1500                     # [RO] /rosout lines kept in the ring.
                                           #      Bounded: a node in a failure
                                           #      loop emits thousands a minute,
                                           #      and running the Jetson out of
                                           #      memory then helps nobody.
    record_dir: "/root/robotx_ws/logs/sessions"   # [RO] session root. Put it on
                                           #      a BIND MOUNT for recordings to
                                           #      survive the container being
                                           #      recreated.
    record_telemetry_hz: 2.0               # [DYN] telemetry.jsonl sample rate
    record_frame_hz: 1.0                   # [DYN] DEFAULT frames/s saved PER
                                           #       viewer, pulled from the MJPEG
                                           #       servers. The Record tab
                                           #       overrides it per session without
                                           #       writing back, so a full-rate
                                           #       afternoon does not become the
                                           #       normal. 0.05-60; 30 is ~1 MB/s,
                                           #       3.6 GB/hour.
    record_min_free_gb: 2.0                # [DYN] refuse to start, and stop
                                           #       mid-run, below this: a full root
                                           #       filesystem takes down the whole
                                           #       stack, not just the recording.

# ---- rc_heartbeat_watchdog: force-disarm on RC-transmitter link loss (safety) ----
# Reads telemetry_bridge's /crsd/rc_channels and /crsd/fcu_status and routes a
# force-disarm back through it (/crsd/force_disarm) — no MAVLink conn of its own.
# Defense in depth beside ArduPilot FS_THR/FS_GCS and the hardware SB e-stop.
# All [RO]. rc_channel/reset_channel read ch7 (SB), as telemetry_bridge and
# pixhawk_led do.
rc_watchdog:
  ros__parameters:
    heartbeat_timeout: 1.0                 # [RO] s of stale monitored-channel PWM -> RC link lost
    rc_channel: 7                          # [RO] channel whose valid PWM is the RC heartbeat
    min_valid_pwm: 900                     # [RO] us; below = no pulses (RC loss reads 0)
    require_armed: true                    # [RO] only force-disarm when armed
    link_timeout: 3.0                      # [RO] s without any bridge topic -> gateway deemed down
    enable_latch: false                    # [RO] true = hold kill until RC reset toggle clears it
    reset_channel: 7                       # [RO] channel whose low->high toggle clears the latch
    reset_low_pwm: 1300                    # [RO] us; reset switch "low" below this
    reset_high_pwm: 1700                   # [RO] us; reset switch "high" above this

# ---- ocs_client: the heartbeat to the Operator Control Station ----
# NOT PROVEN ON THE BOAT — started by hand, absent from core.launch.py. Sends an
# RxReport heartbeat as length-prefixed JSON over one TCP connection that also
# carries OCS commands back down. Commands are republished to /crsd/ocs_command
# and NEVER acted on here: the RC e-stop remains the only safety path.
# All [RO]: ocs_host in particular must not be changeable from a laptop mid-run.
ocs_client:
  ros__parameters:
    ocs_host: "auto"                       # [RO] "auto" = while not connected,
                                           #      dial the source of the newest
                                           #      OCS UDP beacon (under 5 s old,
                                           #      carrying team_id) at the port it
                                           #      names; with none, try
                                           #      ocs_fallback_hosts in turn. Once
                                           #      connected it STAYS until the
                                           #      link drops, so two OCS laptops
                                           #      cannot make it flap (first
                                           #      reached wins).
                                           #      Or a fixed IP, dialled and
                                           #      nothing else (no listener).
                                           #      NOT 127.0.0.1 — that is this
                                           #      Jetson. NEVER 192.168.65-68.x:
                                           #      RoboCommand's course networks
                                           #      (check_config fails it; the OCS
                                           #      never beacons there either).
    ocs_port: 37564                        # [RO] = [tcp] port in the OCS
                                           #      bridge.toml. Clear of 8090
                                           #      (ground_station) and 8080/8081
                                           #      (its viewers). With "auto" this
                                           #      is used for fallback hosts; a
                                           #      beacon carries its own.
    ocs_discovery_port: 37565              # [RO] UDP port LISTENED on for the
                                           #      beacon ("auto" only) =
                                           #      [discovery] port in the OCS
                                           #      bridge.toml. 0 = do not listen
                                           #      (fallback hosts only). Bound
                                           #      without SO_REUSEADDR so it cannot
                                           #      steal another process's
                                           #      datagrams; if taken, the node
                                           #      logs it and uses the fallback
                                           #      list.
    ocs_fallback_hosts: ["192.168.100.107", "192.168.8.107"]   # [RO] tried in
                                           #      turn when no beacon is heard
                                           #      (AP drops broadcasts, OCS not
                                           #      beaconing): lab WiFi, then the
                                           #      Rocket network. IPv4 literals
                                           #      only, at least one, none on a
                                           #      course network. The last host
                                           #      that answered goes first. A new
                                           #      laptop is still found by its
                                           #      beacon.
    vehicle_id: "USV1"                     # [RO] MUST match a [[vehicle]] id in
                                           #      the OCS bridge.toml, or the OCS
                                           #      drops every frame with
                                           #      "not a configured vehicle"
    team_id: "ASTA"                        # [RO] = bridge.toml team_id
    rate_hz: 2.0                           # [RO] the handbook mandates 2 Hz per
                                           #      active vehicle; the OCS rate
                                           #      governor reserves budget for it
    fake_telemetry: false                  # [RO] true = invent a circle, for
                                           #      bench work with no Pixhawk
                                           #      (warns the whole time). NEVER
                                           #      true for a scored run.
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s; stale
                                           #      -> no heartbeat, not a
                                           #      fabricated position
    attitude_timeout_s: 1.0                # [RO] stale -> roll/pitch omitted, the
                                           #      rest of the heartbeat still goes
    status_timeout_s: 1.0                  # [RO] stale -> no heartbeat: without
                                           #      armed/mode the state is
                                           #      unknowable, and the OCS
                                           #      validator refuses STATE_UNKNOWN


# ---- oak_detector: two-stage shape + LED-colour pipeline ----
# THIRD client for the one OAK-D (see buoy_detector). It shares buoy_detector's
# topic (oak/detections) and stream_port 8080 on purpose: the two never run
# together, so target_tracker and the camera tab work behind whichever is up
# without a remap. check_config.py pins the three topic names together.
#
# THE CROP PARAMS ARE A CONTRACT WITH THE TRAINING EXPORTER, not tuning knobs.
# cls_imgsz / crop_pad / crop_top_frac (and ae_compensation: what colour the LED
# records as) decide the picture the classifier sees, and the exporter cut its
# training crops the same way. Disagreement does not fail — the engine just
# classifies worse, everywhere, silently (mixed exporter versions once graded
# 0.97 in training vs 0.55 on fresh crops, all geometry). Change both or neither.
oak_detector:
  ros__parameters:
    # -- stage 1: buoy detector --
    det_engine: "/root/robotx_ws/models/buoy_detector.engine"   # [RO] TensorRT
    # -- stage 1b: shape, measured rather than predicted --
    # 'geometry' measures the marking's OUTLINE on the full-resolution crop
    # (shape_core.marking_shape: whitened 4th harmonic of r(theta) plus bbox fill
    # ratio; they must agree or it abstains). CPU, no model.
    # It lets det_engine be a SINGLE-CLASS "buoy" detector: at 15 m a marking is
    # a couple of feature-map cells and the head is guessing, while the ISP crop
    # is 60-200 px with the outline right there (8/8 on synthetic buoys over
    # 0-66 deg of yaw). Abstentions fall back to the detector's own class, so
    # 'detector' is always safe to switch back to.
    shape_source: "geometry"               # [RO] "geometry" | "detector"
    shape_min_radius: 18.0                 # [RO] marking radius [px] below
                                           #      which it abstains; raise to
                                           #      abstain more. Renders are
                                           #      unreliable under ~6 px and
                                           #      solid by ~10 at 640x400.
                                           #      SCALES WITH rgb_isp_denominator:
                                           #      a marking is 3x wider at 1/1
                                           #      (6 -> 18). Move this whenever
                                           #      rgb_isp_denominator moves.
    shape_min_share: 0.6                   # [RO] share of a track's weighted
                                           #      shape votes one answer needs.
                                           #      Abstentions are never votes
    det_labels:                            # [RO] IN ENGINE ORDER — check the
      - "circle"                           #      dataset.yaml the engine was
      - "diamond"                          #      trained from, not this comment
    det_conf_min: 0.60                     # [RO] minimum detector confidence
    det_imgsz_height: 640                  # [RO] detector engine input height
    det_imgsz_width: 640                   # [RO] detector engine input width
    # -- stage 4: LED colour classifier --
    cls_engine: "/root/robotx_ws/models/led_classifier.engine"  # [RO] TensorRT
    cls_labels:                            # [RO] IN ENGINE ORDER. For an
      - "blue"                             #      ultralytics classifier that is
      - "green"                            #      the training FOLDER order,
      - "off"                              #      i.e. alphabetical — not the
      - "red"                              #      order you find natural
    cls_imgsz: 64                          # [RO] = exporter --crop-size AND the
                                           #      imgsz the engine was exported
                                           #      at. 64, not 96: the LED crop is
                                           #      ~87x48 px on real footage, so
                                           #      96 was upsampling
    crop_pad: 0.10                         # [RO] = exporter's 1.2x box padding
    crop_top_frac: 0.25                    # [RO] = exporter --crop-frac: the
                                           #      fraction of the BUOY kept below
                                           #      the LED (buoylib LED_FRAC), NOT
                                           #      the fraction cut off the crop's
                                           #      top (0.40 would be a band far
                                           #      taller than the exporter's)
    iou_match: 0.25                        # [RO] IoU to continue a track
    max_missed: 10                         # [RO] frames a track survives unseen.
                                           #      Losing a track resets its flash
                                           #      window
    # -- stage 4: colour vote. BYPASSED while flash_enable is true --
    # Set flash_enable false with vote_decay 0.0 and vote_min 0.0 to see the RAW
    # per-frame classification — the view for judging the model, not the tracker.
    vote_decay: 0.85                       # [RO] per-frame forgetting factor
    vote_min: 0.55                         # [RO] share needed to publish
    # -- stage 5: flash detection --
    # Task 1: five light states (OFF, flashing RED / GREEN / BLUE, solid BLUE),
    # flashing 1 s ON / 1 s OFF; Task 2 adds SOLID red and green indicators.
    # Flashing blue is ENTRY and solid blue EXIT: a course-direction decision.
    # THE GAP BETWEEN off_max AND solid_min IS DELIBERATE: a non-periodic signal
    # in it is `unknown` and the label degrades to the bare colour. Reading EXIT
    # as ENTRY sends the boat to the wrong end of the course; refusing is cheaper.
    # Measured, not taste: a confident classifier reports ~0.9 for a lit frame,
    # so a SOLID light measures ~0.90 duty before noise; solid_min 0.85 would make
    # a solid buoy unclassifiable if the model is wrong one frame in ten. These
    # survive 10% frame error and abstain at 25%.
    flash_enable: true                     # [RO] false -> colour only, via voter
    flash_window_s: 6.0                    # [RO] duty window; 3 full periods
    flash_min_span_s: 4.0                  # [RO] observed time before a verdict
    flash_min_samples: 8                   # [RO] frames before a verdict
    solid_min: 0.70                        # [RO] at/above this = solid
    off_max: 0.30                          # [RO] at/below this = off
    colour_min_share: 0.6                  # [RO] share of LIT frames one colour
                                           #      needs before it is named
    # -- how "flashing" is actually decided --
    # NOT by duty cycle alone: a 1 s / 1 s light averages 0.5, and so does a
    # classifier hedging at 0.5 every frame — how this one fails (`off`: 27%
    # recall on a held-out session). So the tracker asks whether the signal MOVES
    # LIKE A LIGHT: anti-correlation with itself half a period earlier (square
    # wave ~1.0, noise ~0). SCALE-FREE, so a faint green flash (0.52 to 0.47;
    # green's whole margin over an unlit hull is +6 saturation points) passes as
    # well as a bright red one. 14/14 on synthetic cases incl. 25% frame error.
    flash_period_s: 2.0                    # [RO] FULL cycle [s]. Task 1 is
                                           #      1 s ON / 1 s OFF = 2.0
    flash_corr_min: 0.45                   # [RO] anti-correlation at half a
                                           #      period needed to call it
                                           #      flashing
    flash_debug_path: ""                   # [RO] jsonl of every observation, to
                                           #      replay footage through the
                                           #      tracker off-boat. "" = off; one
                                           #      line per detection per frame
    # -- ranging --
    range_min_m: 0.30                      # [RO] depth below this is invalid
    range_max_m: 25.0                      # [RO] depth above this is invalid
    min_depth_samples: 5                   # [RO] valid pixels needed to range
    # -- output --
    frame_id: "camera_link"                # [RO] REP-103: x fwd, y left, z up
    detections_topic: "crsd/oak/detections"     # [RO] = buoy_detector.detections_topic
    health_topic: "crsd/oak_detector_health"   # [RO] std_msgs/String JSON:
                                           #      per-track light state and the
                                           #      rate the flash tracker needs
    # -- camera: fps and isp_denominator MUST equal the other OAK-D nodes.
    # subpixel / lr_check / sync_threshold_ms are constants in oak_pipeline.py.
    fps: 15.0                              # [RO] = oakd_publisher.fps. 15, NOT
                                           #      30, for the USB link: colour
                                           #      (NV12) + depth cross XLink EVERY
                                           #      frame, so load = size x rate:
                                           #        640x400  @30 =  27 MB/s  ok
                                           #        1920x1200@30 = 119 MB/s  DIES
                                           #        1920x1200@15 =  60 MB/s
                                           #      (X_LINK_ERROR, node exits). The
                                           #      flash is 1 s on/off, so even
                                           #      4 fps clears Nyquist.
    rgb_isp_denominator: 1                 # [RO] 1/N for the COLOUR camera
                                           #      ALONE (1 -> 1920x1200). Both
                                           #      paths at 1/2 halved the frame
                                           #      rate with inference barely
                                           #      moved — the cost is stereo and
                                           #      USB — and past 1280 px wide the
                                           #      stereo engine drops EVERY frame.
                                           #      The 64x64 LED crop is cut from
                                           #      the RAW frame, so this helps the
                                           #      CLASSIFIER; the 640x640 DETECTOR
                                           #      only after a larger re-export.
    isp_denominator: 3                     # [RO] 3 -> 640x400. Raise resolution
                                           #      (2 -> 960x600) if no_crop is
                                           #      high — moves all three nodes
    # ---- camera profile: every one [DYN], tunable from the Tuning tab ----
    # Ranges are depthai's own (2.32), ENFORCED from the table the node builds
    # its parameter spec from (oak_controls.py).
    # A tuning surface because the right profile depends on the light: at dusk
    # facing a bright sky, whole-frame metering chose 2214 us at ISO 100 (1/15th
    # of the shutter, no gain) — median luma 12/255, 38% crushed to black.
    ae_mode: "auto"                        # [DYN] auto | manual. manual pins
                                           #       exposure_us + iso and makes
                                           #       every ae_* setting inert.
    exposure_us: 8000                      # [DYN] shutter when ae_mode=manual
    iso: 400                               # [DYN] gain when ae_mode=manual,
                                           #       100..1600 (100 is the floor)
    ae_compensation: -3                    # [DYN] EV steps, -9..9; negative is
                                           #       darker. A TRAINING CONTRACT:
                                           #       match the classifier footage's
                                           #       exposure (oak_record.py uses
                                           #       -3). Moving it means retraining
                                           #       or accepting new colours.
    ae_max_exposure_us: 8000               # [DYN] shutter cap; AE spends gain
                                           #       past it. Uncapped, depthai buys
                                           #       brightness with smear — a noisy
                                           #       sharp buoy detects where a
                                           #       smeared one does not. 0 =
                                           #       uncapped.
    ae_lock: false                         # [DYN] freeze AE where it is
    ae_region_top: 0.35                    # [DYN] metering band, as fractions
    ae_region_height: 0.45                 # [DYN] of frame height. WHERE the
                                           #       meter looks matters more than
                                           #       the bias outdoors: 0.35+0.45 is
                                           #       the horizon and near water
                                           #       (median luma 12 -> 41). height
                                           #       0 = whole frame. Fractions of
                                           #       the SENSOR, before ISP scale.
    awb_mode: "auto"                       # [DYN] auto | off | daylight |
                                           #       cloudy_daylight | shade |
                                           #       twilight | incandescent |
                                           #       fluorescent | warm_fluorescent
    wb_temperature_k: 5000                 # [DYN] 1000..12000, only when
                                           #       awb_mode is off. Water and sky
                                           #       are strongly blue, auto WB's
                                           #       worst case: it corrects the blue
                                           #       away and the buoys with it.
    brightness: 0                          # [DYN] -10..10, post-ISP. Cannot
                                           #       recover a crushed shadow --
                                           #       fix exposure first.
    contrast: 0                            # [DYN] -10..10
    saturation: 0                          # [DYN] -10..10. Careful: the LED
                                           #       classifier tells a lit buoy
                                           #       from its hull BY saturation.
    sharpness: 1                           # [DYN] 0..4, depthai default 1
    luma_denoise: 1                        # [DYN] 0..4, worth raising once high
    chroma_denoise: 1                      # [DYN] 0..4, ISO is in play
    anti_banding: "auto"                   # [DYN] off | mains_50_hz |
                                           #       mains_60_hz | auto. Mains
                                           #       flicker: dock lights only.
    poll_period_s: 0.01                    # [RO] output-queue poll period [s]
    queue_size: 4                          # [RO] device output queue depth
    health_period_s: 5.0                   # [RO] rate/health log period [s]
    # -- annotated view --
    stream_enable: true                    # [RO] MJPEG over HTTP; frames drawn
                                           #      only while a browser is open
    stream_port: 8080                      # [RO] SHARED with buoy_detector and
                                           #      tools/oak_view.py: one camera,
                                           #      so never contended
    stream_quality: 60                     # [RO] JPEG quality for that view

# ---- Missions: bt_runner_node — one coarse action outside, a tree inside ----
# Crusader's bt_navigator: accepts a SafePassage goal, loads the Task 1
# behaviour tree and ticks it; the leaves are primitives that publish a
# GuidedSetpoint and poll /crsd/pose for arrival. Runtime XML:
# crusader_bt/behavior_trees/. NOT in core.launch.py.
bt_runner_node:
  ros__parameters:
    tree_file: "/root/robotx_ws/install/crusader_bt/share/crusader_bt/behavior_trees/task1_safe_passage.xml"
                                            # [DYN] absolute, INSIDE the container,
                                            #      read per accepted goal. No code
                                            #      default: silently ticking the
                                            #      wrong tree is worse than
                                            #      refusing to start.
    action_name: "/crsd/safe_passage"       # [RO] the coarse mission action
    tick_hz: 10.0                           # [RO] tree tick rate. ALSO the cancel
                                            #      latency and the guard band's
                                            #      flight-mode re-check rate.
    default_timeout_s: 600.0                # [RO] used when the goal sends 0. It
                                            #      lives in the RUNNER, not the
                                            #      XML, so a tree that never
                                            #      terminates cannot strand the boat.
    mode_grace_s: 3.0                       # [RO] missing HEARTBEAT tolerated at
                                            #      goal start (15 beats at 5 Hz).
    stream_timeout_s: 1.0                   # [RO] = shared.pose_timeout_s. Older
                                            #      and the tree is told the pose
                                            #      is stale rather than acting on it.
    plan_timeout_s: 15.0                    # [RO] the UAV plan arrives at ~0.2 Hz,
                                            #      so it cannot share the pose
                                            #      timeout. A stale plan halts the
                                            #      mission: a dead radio must STOP
                                            #      the boat, not leave it driving a
                                            #      passage nobody can confirm.
    assoc_radius_m: 5.0                     # [RO] how near a tracked contact must
                                            #      be to count as a plan buoy. Too
                                            #      large and two buoys claim one
                                            #      contact; the global greedy
                                            #      fusion cannot double-claim, but
                                            #      CAN pair the wrong two.
    publish_setpoints: false                # [RO] FALSE = this node CANNOT move
                                            #      the boat. Legs still poll for
                                            #      arrival, so a human can drive
                                            #      and the tree follows — the
                                            #      read-only water test. Turning it
                                            #      true is a G1 gate.
    fire_pump: false                        # [RO] FALSE = FireBurst runs DRY: it
                                            #      lines up, logs "FIRE #n (DRY)"
                                            #      and never asks for the pump.
                                            #      Separate from publish_setpoints:
                                            #      moving is G1, water is G7.
    # The sticks for the MANUAL fire tree (StrafeKeep -> /crsd/rc_override), in
    # the order [ahead, lateral, yaw]: dp_hold's map and its measured neutrals.
    # G1 row O9 checks each DIRECTION; flip one with stick_reverse.
    stick_channels: [3, 4, 1]               # [RO] throttle, lateral, steer
    stick_neutral_us: [1495, 1495, 1489]    # [RO] = RC3/RC4/RC1_TRIM
    stick_reverse: [false, false, false]    # [RO]
    task_token: "TASK_SAFE_PASSAGE"         # [RO] an RxTask name (check_config
                                            #      vs ocs_link.RX_TASKS)
    autonomous_modes: ["GUIDED", "AUTO", "LOITER", "RTL"]
                                            # [RO] = shared.autonomous_modes; read
                                            #      by the guard band's IsAutonomous
                                            #      leaf.
    # -- Task 3 (behavior_trees/task3_disruptive.xml) --
    # The runner places every docking-bay sighting with these. They MUST equal
    # target_tracker's (check_config): one camera placed twice is two worlds that
    # disagree about where things are.
    cam_x: 0.37                             # [RO] = target_tracker.cam_x
    cam_y: 0.0                              # [RO] = target_tracker.cam_y
    cam_yaw_deg: 0.0                        # [RO] = target_tracker.cam_yaw_deg
    cam_pitch_deg: 0.0                      # [RO] = target_tracker.cam_pitch_deg,
                                            #      + = aimed DOWN. Task 3 may need
                                            #      it NEGATIVE: level, from inside
                                            #      a slip the camera cannot see the
                                            #      upper window
                                            #      (docs/T3_coordinated_logistics.md)
    dock_face_dz_m: 0.39                    # [RO] face centre above the camera
                                            #      (pitched camera only): ~0.8 m
                                            #      above water per the build
                                            #      guide, camera at 0.41 m
    dock_topic: "dock/observations"         # [RO] DockObservation, from the
                                            #      dock detector (firefighting-cv
                                            #      specs: observations_topic)
    # -- obstacle avoidance (docs/nav2_avoidance_spec.md 5.8; crusader_bt README) --
    # NavigateTo and CircleBuoy plan around every known hazard through Nav2's
    # planner_server and hold when they cannot; ArduPilot still flies the boat
    # (GUIDED setpoints). Avoidance is not a safety system: the RC e-stop is.
    nav_mode: "off"                         # [RO] off = straight legs, no planner;
                                            #      shadow = plans and shows the
                                            #      path, drives straight legs;
                                            #      on = drives the planned path.
                                            #      The sim and lake rigs pass
                                            #      -p nav_mode:=... A build without
                                            #      nav2_msgs refuses anything but off.
    nav_map_frame: "map"                    # [RO] = nav2 global_costmap
                                            #      global_frame (check_config)
    nav_datum_topic: "/crsd/datum"          # [RO] = nav_frames_node.datum_topic.
                                            #      shadow/on: the BT frame waits
                                            #      for this datum, not the first fix
    nav_hazards_topic: "/crsd/nav/hazards"  # [RO] HazardArray out = nav2_params
                                            #      hazard_layer.topic (check_config)
    nav_leg_topic: "/crsd/nav/leg_status"   # [RO] leg status JSON out
                                            #      = ground_station.nav_leg_topic
    nav_planner_action: "/compute_path_to_pose"
                                            # [RO] planner_server's action
    nav_valid_service: "/is_path_valid"     # [RO] ... and its path check
    nav_clear_service: "/global_costmap/clear_entirely_global_costmap"
                                            # [RO] ... and the costmap clear
    nav_planner_id: "GridBased"             # [RO] a plugin in nav2_params
                                            #      planner_plugins (SmacPlanner2D)
    nav_hazard_rate_hz: 2.0                 # [RO] known-hazard publish rate. The
                                            #      layer's max_age_s must cover two
                                            #      periods (check_config)
    nav_status_hz: 2.0                      # [RO] leg status rate, plus every
                                            #      state change
    nav_hard_m: 0.8                         # [RO] "0.8 m hard": never closer than
                                            #      this to a hazard's surface. At
                                            #      most robot_radius*cos(pi/16)
                                            #      (check_config)
    nav_soft_m: 2.0                         # [RO] "2 m soft" = inflation_radius
                                            #      (check_config)
    nav_buoy_radius_m: 0.30                 # [RO] a RoboBuoy, circumscribed: its
                                            #      footprint is 0.432 m square
    nav_track_radius_m: 0.30                # [RO] a LiDAR track no plan buoy claims
    nav_exempt_radius_m: 1.0                # [RO] a track this close to an exempt
                                            #      buoy is that buoy, not a third
    nav_lookahead_m: 5.0                    # [RO] the carrot sits this far ahead
    nav_lookahead_min_m: 3.0                # [RO] ... and at least this far
    nav_max_chord_dev_m: 0.3                # [RO] the carrot's chord may cut the
                                            #      path by this much, no more
    nav_wp_radius_m: 2.0                    # [RO] = the autopilot's WP_RADIUS
                                            #      (check_config): an intermediate
                                            #      carrot this close is reached
    nav_replan_period_s: 0.5                # [RO] plan at most this often
    nav_min_request_gap_s: 0.2              # [RO] ... and never faster than this
    nav_check_period_s: 0.1                 # [RO] is_path_valid at most this often
    nav_plan_timeout_s: 1.0                 # [RO] no answer by then = cannot plan
                                            #      (Humble's planner hangs on a
                                            #      non-current costmap)
    nav_first_plan_wait_s: 1.0              # [RO] no plan yet by then = hold
    nav_invalid_confirm: 2                  # [RO] is_path_valid must say invalid
                                            #      this many times in a row
    nav_hysteresis_frac: 0.2                # [RO] a new path replaces a valid one
                                            #      only if shorter by this fraction
    nav_hysteresis_m: 3.0                   # [RO] ... AND by this many metres
    nav_goal_replan_m: 1.0                  # [RO] a goal that moves this far
                                            #      forces a replan
    nav_clip_radius_m: 35.0                 # [RO] goals are clipped to this radius
                                            #      round the boat: inside the
                                            #      costmap window (check_config)
    nav_clear_after_s: 5.0                  # [RO] blocked this long = clear the
                                            #      costmap once and replan
    nav_unblock_reset_s: 3.0                # [RO] continuous FOLLOWING this long
                                            #      resets the blocked clock
    nav_escape_margin_m: 0.5                # [RO] a start inside the hard zone
                                            #      escapes to this much beyond it
    nav_goal_margin_m: 0.3                  # [RO] a goal inside the hard zone is
                                            #      pushed out to this beyond it
    nav_local_check_tol_m: 0.1              # [RO] the BT's own checks use
                                            #      hard - this, for quantisation
    nav_orbit_max_push_m: 3.0               # [RO] an orbit point near a hazard is
                                            #      pushed out by at most this
    nav_orbit_clear_m: 1.4                  # [RO] ... until it is this clear. Also the
                                            #      goal rule for every orbit hop as it
                                            #      starts, ring[0] included (clearPoint)
    nav_orbit_radius_m: 6.0                 # [RO] ENTRY/EXIT orbit radius (CircleBuoy;
                                            #      an XML radius= still wins). Tight
                                            #      fields: ~2 (buoy 0.3 + hard 0.8 +
                                            #      the hull's half-length, with room)
    nav_orbit_points: 8                     # [RO] ring points; more for a small radius
                                            #      so a hop stays short and on the circle
    nav_orbit_tolerance_m: 2.0              # [RO] a ring hop counts as arrived within
                                            #      this; keep it under the chord
                                            #      (2 r sin(180/points)) or hops are skipped
    nav_gate_standoff_m: 6.0                # [RO] gate through point, metres past the
                                            #      middle (the most; see nav_gate_min_*)
    nav_gate_approach_m: 8.0                # [RO] gate approach point, metres short of it
    nav_gate_clear_m: 1.5                   # [RO] THE GOAL RULE for gates: the straight
                                            #      crossing and both gate points keep
                                            #      this from every hazard's EDGE (a buoy
                                            #      centre: + nav_buoy_radius_m)
    nav_gate_min_standoff_m: 3.5            # [RO] a crowded gate's through point may
                                            #      back off from the tree's standoff
                                            #      (6) to this; keep it > the through
                                            #      leg's tolerance (2.5) or the boat
                                            #      "arrives" before the gate line
    nav_gate_min_approach_m: 4.0            # [RO] ... and its approach point from 8 to
                                            #      this, the room to line up
    nav_gate_margin_m: 1.8                  # [RO] then the crossing may move off-centre
                                            #      in the gap, never closer than this
                                            #      to either gate buoy
    nav_gate_step_m: 0.25                   # [RO] search pitch for both of the above
                                            #      (the widest shift the margin allows
                                            #      is always tried as well)
    nav_gate_tight_clear_m: 1.0             # [RO] nothing fits? the same search again
                                            #      with this clearance (hard_m + 0.2;
                                            #      the guard needs hard - tol = 0.7) ...
    nav_gate_tight_margin_m: 1.1            # [RO] ... and this from the gate buoys
                                            #      (hard_m + buoy_radius_m). Tight is
                                            #      better than sitting still
    nav_goal_max_move_m: 3.0                # [RO] the goal rule moves a goal at most
                                            #      this far to clear it; nothing clear
                                            #      that close -> the goal stays and the
                                            #      leg's guard holds the boat
    nav_dock_finger_len_m: 2.0              # [RO] build guide: dock fingers
    nav_dock_finger_w_m: 0.5                # [RO]
    nav_dock_slip_w_m: 1.5                  # [RO]
    nav_dock_deck_depth_m: 1.0              # [RO]
    nav_fence_len_m: 10.0                   # [RO] SIDE FENCES, nav_mode on only: each
                                            #      red/green in the passage plan gets a
                                            #      wall of hazard circles this long,
                                            #      OUTWARD from the buoy (gate: away
                                            #      from the partner; single: red right
                                            #      / green left of the axis), so the
                                            #      planner passes it only on the
                                            #      handbook's side. 0 = no fences
    nav_fence_spacing_m: 0.5                # [RO] circle pitch; < 2 x radius = a wall
    nav_fence_radius_m: 0.3                 # [RO] circle radius
    nav_fence_clear_m: 8.0                  # [RO] no circle this close to the ENTRY or
                                            #      EXIT buoy: orbit radius 6 +
                                            #      nav_orbit_clear_m 1.4 + radius 0.3

# ---------------------------------------------------------------------------
# rxl_link_node — the boat's end of the UAV link.
#
# Speaks MAVLink to the RADIO, never the Pixhawk: different endpoint, dialect,
# and a message set with no command in it — it cannot arm, set a mode, or move
# the boat. telemetry_bridge stays the only path to the autopilot; the two never
# share a socket.
# In core.launch.py (respawning), so the Radio tab survives a reboot. Do not
# also hand-start it: two processes on the radio's serial port each read half.
rxl_link_node:
  ros__parameters:
    rxl_endpoint: "/dev/crsd-rfd"
                                            # [RO] THE RFD900, on its FTDI cable,
                                            #      via a udev symlink (tools/udev):
                                            #      never /dev/ttyUSB0 (plug
                                            #      order) nor by-id (names ONE
                                            #      cable; a swapped cable left the
                                            #      node on a dead path). The link
                                            #      node OWNS it; nothing else may
                                            #      open it, including the test
                                            #      kit's companion.py.
                                            #      SITL/bench: override per run,
                                            #      do not edit this line:
                                            #        ros2 run crusader_link \
                                            #          rxl_link_node --ros-args \
                                            #          -p rxl_endpoint:=udpin:127.0.0.1:14555
                                            #      udpin BINDS and listens; "udp:"
                                            #      is an outbound client that
                                            #      receives nothing, silently.
                                            #      Not 14551: telemetry_bridge's,
                                            #      and a udpin bind STEALS
                                            #      datagrams (the displaced
                                            #      consumer sees silence). 14550
                                            #      stays free for ad-hoc tooling.
    radio_traffic_topic: "crsd/radio/traffic"  # [RO] every frame sent or heard,
                                            #      for the Radio tab. A RECORD:
                                            #      nothing acts on it.
    uav_sysid: 200                          # [RO] the Radio tab's test-frame
                                            #      target: the aircraft's autopilot
                                            #      is 1 (Fleet ICD), its companion
                                            #      answers from 200.
    rxl_baud: 115200                        # [RO] serial endpoints only; every
                                            #      mesh radio runs SERIAL=115.
    source_system: 42                       # [RO] the boat's MAVLink sysid on the
                                            #      MESH, not the autopilot link.
                                            #      Must differ from the aircraft's
                                            #      or an inspector files both
                                            #      vehicles under one tree.
    plan_topic: "crsd/passage_plan"         # [RO] PassagePlan out, ON ARRIVAL.
                                            #      Never resampled: republishing
                                            #      the last plan would defeat the
                                            #      staleness check downstream.
    gate_topic: "crsd/next_gate"            # [RO] GatePair out, on arrival.
    gate_reached_topic: "crsd/gate_reached" # [RO] std_msgs/UInt8 IN. The ONLY
                                            #      thing the boat transmits on
                                            #      this link.
    quiet_warn_s: 15.0                      # [DYN] say so once when the link goes
                                            #       quiet. Warns; publishes
                                            #       nothing either way.
