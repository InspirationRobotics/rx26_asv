# ============================================================================
# Crusader: the ROS parameters this boat runs with.
#
# Every node declares all of its parameters, with defaults, in code: PARAMS in the
# Python nodes, declare_parameter and NavParams in bt_runner_node. A section here
# lists what is set for THIS boat (wiring, mountings, the gates, the tuned planner);
# the rest are the code's. tools/scripts/check_config.py fails a key its node does
# not declare (ROS would ignore it without a word) and one of the wrong type (1 for a
# double stops the node at startup).
#
# [DYN] = applied live from `ros2 param set` or the GCS Params tab. Everything else is
# read once at start: change it here and restart the node (no rebuild).
#
# TWO HARD FORMAT RULES: rcl's parser is stricter than PyYAML. Break either and
# EVERY node in the launch dies at rclpy.init() with "Couldn't parse params file",
# the LEDs included:
#   1. NO YAML anchors/aliases (&name / *name): rcl parses tokens, not YAML.
#   2. EVERY top-level key is a node name, or /** for every node, whose only child is
#      ros__parameters.
# check_config.py enforces both.
# ============================================================================

# Every node that declares one of these takes this value, so no two can differ.
# check_config fails a node section that sets one again.
/**:
  ros__parameters:
    # Age at which a /crsd/pose sample stops being usable. telemetry_bridge's and
    # bt_runner_node's stream_timeout_s must equal it (check_config): a consumer
    # trusting a pose longer than the bridge vouches for it is the frozen-pose failure.
    pose_timeout_s: 1.0
    # The flight modes that mean "we are driving, not the pilot": what the boat obeys
    # (telemetry_bridge, bt_runner_node), shows (mast GREEN, mandatory per 5.3.1) and
    # reports (ocs_client STATE_AUTO). Uppercase, as mode_string_v10 returns them.
    # LOITER gets ArduPilot's simple avoidance only; BendyRuler/Dijkstra runs in AUTO,
    # GUIDED and RTL alone.
    autonomous_modes: ["GUIDED", "AUTO", "LOITER", "RTL"]

# ---- telemetry_bridge: the one MAVLink gateway, and the boat's RC wiring ----
telemetry_bridge:
  ros__parameters:
    mav_endpoint: "udp:127.0.0.1:14551"    # MAVProxy's rebroadcast, never the serial port
    fcu_sysid: 2                           # the autopilot's SYSID_THISMAV; Ekko is 1
    # The RC drop latch governs the RC-OVERRIDE path only. NOT ch7: that is the SB
    # arm/e-stop switch (up ~1995 = arm), so arming would trip it and block every
    # override. ch9 has no switch yet (SD proposed): it reads ~1500 and NEVER TRIPS, so
    # today the kills are SC (mode) and SB (e-stop). GUIDED is gated on the MODE.
    drop_channel: 9
    drop_threshold: 1700                   # us; crossing trips the latch
    # The water pump: /crsd/pump_cmd -> DO_REPEAT_SERVO. 0 (every burst refused) until
    # docs/G7_pump_bench.md is done; then the Pixhawk output with SERVOn_FUNCTION =
    # 50 + pump_rc_channel and SERVOn_TRIM = pump_off_pwm: the autopilot ends each
    # burst at TRIM (check_config checks both against the baseline).
    pump_servo_channel: 9                  # Pixhawk output 1..16 (AUX1 = 9, 2026-10-11); 0 = none
    pump_rc_channel: 10                    # the pilot's pump switch; = squirt_cal's
    pump_on_pwm: 2000                      # us; MEASURE on the bench (G7)
    pump_off_pwm: 1000                     # us; MUST equal SERVOn_TRIM
    hs_wp_speed_mps: 1.2                   # = WP_SPEED: heading+speed thrust 1.0 means this
    # /crsd/rc_override (the fixed-nozzle shot strafes; only MANUAL strafes on this
    # OmniX hull). SB ch7, SC ch8, the pump and the drop switch stay the pilot's.
    override_channels: [1, 3, 4]           # steer, throttle, lateral
    estop_channel: 7                       # SB; = led_status_node's. Below the threshold =
    estop_threshold: 1200                  # e-stop or RC lost: the e-stop stops MOTORS, not
                                           # pass-through outputs, so the bridge sends the
                                           # pump OFF
    # The pan/tilt cannon (cannon_core): /crsd/water_cannon -> DO_SET_SERVO on AUX3 pan /
    # AUX4 tilt (SERVO11/12_FUNCTION 0, MIN/MAX 1100/1900), water through the pump above.
    # Numbers from task3-gazebo (2026-10-11/12, on the water).
    cannon_pan_channel: 11
    cannon_tilt_channel: 12
    cannon_pump: false                     # G7 for the cannon: false = aims, water DRY
    cannon_nozzle_xyz: [0.37, 0.279, 0.75] # pivot: level with the camera, 11 in to port
    cannon_cam_xyz: [0.37, 0.0, 0.65]      # = target_tracker cam_x/y/z
    cannon_exit_speed_mps: 0.0             # 0 = from the throw: 9 ft at 30 deg onto the water
    cannon_throw_range_m: 2.74
    cannon_throw_elev_deg: 30.0
    cannon_throw_drop_m: 0.51
    cannon_tilt_center_us: 1680.0          # level with the hull, by eye (2026-10-09)
    cannon_tilt_sign: -1.0                 # the tilt servo is mounted reversed

# ---- Task 3 fixed nozzle: the calibration tool (tools/squirt_cal) ----
# A bench tool, not a node in the launch file: python3 tools/squirt_cal/squirt_cal.py
# Every key must be here (squirt_core.load_config refuses unknown and missing).
squirt_cal:
  ros__parameters:
    port: 8094                             # the phone opens http://<jetson>:8094
    log_dir: "/root/robotx_ws/logs/squirt_cal"   # bind-mounted: one dir per session
    snapshot_topic: "/crsd/camera/raw/compressed"   # camera_node; "" = no camera frames
    wall_range_topic: "/crsd/wall_range"   # = lidar_node's wall topic
    pump_rc_channel: 10                    # = telemetry_bridge.pump_rc_channel
    pump_on_threshold_us: 1700             # pilot switch reads ON above this
    burst_choices_s: [0.2, 0.3, 0.5]
    burst_default_s: 0.3
    arm_timeout_s: 15.0                    # give up waiting for steady
    min_gap_s: 2.0                         # between shots
    verdict_after_s: 0.8                   # the water's flight + a look
    pilot_burst_max_s: 3.0
    range_window_s: 0.5                    # pre-fire range = median over this
    range_max_age_s: 0.5
    step_m: 0.1                            # search step until bracketed
    on_range_tol_m: 0.02
    min_hits_for_band: 3
    square_tol_deg: 3.0
    steady_rate_max_dps: 4.0               # "steady": rates, band, hands off
    steady_band_deg: 1.5
    steady_hold_s: 0.5
    steady_mean_s: 5.0
    sticks_quiet_s: 1.5
    stick_tol_us: 25
    att_min_hz: 10.0                       # needs SR0_EXTRA1 >= 10 (30 intended)
    # The starting guess only. MEASURE these (docs/G7_pump_bench.md, Phase 0):
    nozzle_x_m: 0.45                       # nozzle ahead of the body origin
    nozzle_height_m: 0.4                   # above the water
    nozzle_elev_deg: 45.0
    nozzle_range_m: 3.0                    # level range at nozzle_elev_deg
    deck_height_m: 0.3                     # face panel bottom above the water
    face_setback_m: 0.0                    # panel behind the edge the LiDAR ranges
    branch: "near"                         # near = rising part of the arc
    target_ids: ["ul_top", "lr_top"]
    target_labels: ["Upper-left window, top edge", "Lower-right window, top edge"]
    target_edge_mm: [895.0, 645.0]         # above the face panel's bottom edge
    target_lat_m: [0.22, -0.23]            # window centre from face centre, + left

# ---- LED status stack ----
led_node:
  ros__parameters:
    port: "/dev/crsd-led"                  # udev symlink (tools/udev), not by-id
    baud: 115200                           # must match firmware/LED.ino Serial.begin

led_status_node:
  ros__parameters:
    estop_channel: 7                       # = telemetry_bridge's (check_config)
    estop_threshold: 1200

# ---- rc_watchdog: force-disarm on RC-transmitter link loss ----
# Reads telemetry_bridge's /crsd/rc_channels and /crsd/fcu_status and disarms through it
# (/crsd/force_disarm). Defense in depth beside ArduPilot FS_THR/FS_GCS and the SB e-stop.
rc_watchdog:
  ros__parameters:
    rc_channel: 7                          # SB, whose valid PWM is the RC heartbeat
    reset_channel: 7                       # its low->high toggle clears an enable_latch kill

# ---- crusader_perception: camera_node (the OAK-D) and lidar_node (the MID360) ----
# Every parameter and its default is in the node's PARAMS (oak_detector_core, dock_model and
# oak_controls for camera_node); this lists what is set for this boat. [DYN] = live.
#
# camera_node is NOT in core.launch.py: start it from the Nodes tab.
# THE CROP PARAMS ARE A CONTRACT WITH THE TRAINING EXPORTER: cls_imgsz, crop_pad,
# crop_top_frac (and ae_compensation, the colour the LED records as) must match what
# cut the training crops, or the classifier is silently worse everywhere.
camera_node:
  ros__parameters:
    model: "buoy"                          # [DYN] none | buoy | dock
    fps: 15.0                              # the flash tracker needs 3 fps or more
    isp_denominator: 3                     # stereo and depth 640x400 (1280 wide at most)
    rgb_isp_denominator: 1                 # colour 1920x1200: the dock model wants exactly this
    det_engine: "/root/robotx_ws/models/buoy_detector.engine"
    det_labels: ["circle", "diamond"]      # IN ENGINE ORDER: a wrong order mislabels every box
    cls_engine: "/root/robotx_ws/models/led_classifier.engine"
    cls_labels: ["blue", "green", "off", "red"]   # IN ENGINE ORDER (training folder order)
    cls_imgsz: 64
    crop_pad: 0.1
    crop_top_frac: 0.25
    dock_ffcv_dir: "/root/robotx_ws/models/ffcv"
    # the camera profile the boat starts on; camera_profiles.yaml holds the others
    ae_compensation: -3                    # [DYN] also a training contract, see above
    ae_max_exposure_us: 8000               # [DYN] shutter cap: no motion blur on a moving boat
    ae_region_top: 0.35                    # [DYN] meter the band around the horizon,
    ae_region_height: 0.45                 # [DYN]   not the sky

# lidar_node: clusters, the Nav2 cloud, proximity for the autopilot, the Task 3 wall.
# THE EXTRINSIC IS BENCH-CONFIRMED (docs/G2_lidar_orientation.md): mounted upside down,
# the raw frame is x forward, y starboard, z down. Re-run G2 after any remount.
#
# Proximity (crsd/obstacle_distance) is a backstop, not the avoidance: that is the Nav2
# planner. The autopilot ignores it unless PRX1_TYPE = 2, and with AVOID_MARGIN 2.0
# ArduRover stops the boat inside the planner's band and in the Task 3 berth.
lidar_node:
  ros__parameters:
    lidar_sign_y: -1.0
    lidar_sign_z: -1.0
    lidar_x: 0.32                          # m forward of the geometry centre
    lidar_y: 0.05                          # m to port of the centreline
    lidar_z: 0.52                          # m above the hull-bottom datum (0.28 above water)
    water_z: 0.24                          # [DYN] MEASURED waterline above the datum. To see
                                           #       low debris lower water_margin, not this
    r_max: 10.0                            # [DYN] POOL value: walls become 100+ tracks at 40.
                                           #       Open water: ros2 param set /lidar_node r_max 40.0
    nav_cloud_enable: true                 # [DYN] THE POOL SWITCH: false publishes empty clouds
                                           #       (walls would be lethal, goals unreachable)
    wall_enable: true                      # /crsd/wall_range: the cannon tree holds range on it
# ---- Nav2 avoidance: nav_frames_node — the datum, and TF map -> base_footprint ----
# docs/nav2_avoidance_spec.md section 2. TF `map`, bt_runner's east/north frame and every
# HazardArray coordinate are ONE equirectangular ENU plane on one datum, chosen here alone
# and published latched on /crsd/datum. Started by nav.launch.py; not in core.launch.py.
# "param" is restart-stable: use it in competition and the sim (nav.launch.py
# datum_source:=param datum_lat:=.. datum_lon:=..). "first_fix" is NOT respawned: a restart
# would pick a new datum and shift the map under a running bt_runner. Competition day: open
# decision D1 in the spec.
nav_frames_node:
  ros__parameters:
    datum_source: "first_fix"              # "param" or "first_fix"
    datum_lat: 0.0                         # with "param"; (0, 0) there is a config error
    datum_lon: 0.0

# ---- World model: target_tracker — detections + pose -> earth-anchored targets ----
# Not in core.launch.py. Every parameter and its default is in the node's PARAMS.
#
# CAMERA EXTRINSIC (Resources.md): translation MEASURED against the LiDAR's hull-bottom
# datum, so camera and LiDAR z of one buoy agree. Orientation NOT bench-confirmed: zero
# angles are belief, the kind that got the LiDAR's y-sign wrong until G2. Must equal
# bt_runner_node's copy (check_config).
target_tracker:
  ros__parameters:
    cam_x: 0.37                            # m forward of the body origin (LiDAR 0.32)
    cam_y: 0.0                             # m to port; on the centreline
    cam_z: 0.65                            # m above the hull-bottom datum, as lidar_z
    cam_yaw_deg: 0.0                       # + = aimed to port. ASSUMED
    cam_pitch_deg: 0.0                     # + = aimed down. ASSUMED
    use_lidar: false                       # [DYN] false = camera-only: in a pool or beside a
                                           #       dock an unlabelled cluster is the WALL, and
                                           #       with track_timeout_s 0 it never leaves.
                                           #       OPEN WATER: true, with lidar_node r_max 25-40
                                           #       (stereo range is ~6% off; LiDAR is cm)
# ---- Ground station: gcs_bridge, which the laptop's gcs_app connects to on tcp/14559 ----
# Every parameter and its default is in the node's PARAMS.
gcs_bridge:
  ros__parameters:
    record_dir: "/root/robotx_ws/logs/sessions"   # a bind mount, or recordings die with the
                                                  # container (it says so at startup)
    allow_power: true                      # shutdown/reboot from the Nodes tab, locked while armed

# ---- ocs_client: the heartbeat to the Operator Control Station ----
# Started by hand, absent from core.launch.py. Commands from the OCS are republished on
# /crsd/ocs_command and NEVER acted on here: the RC e-stop is the only safety path.
# Discovery: "auto" dials the newest OCS beacon (ocs_link's discovery port), else
# ocs_link's fallback hosts; NEVER a RoboCommand course address (192.168.65-68.x,
# check_config fails it).
ocs_client:
  ros__parameters:
    ocs_host: "auto"                       # or a fixed OCS IP on the team subnet
    ocs_port: 37564                        # = [tcp] port in the OCS bridge.toml
    vehicle_id: "USV1"                     # MUST match a [[vehicle]] id in bridge.toml, or
                                           # the OCS drops every frame
    team_id: "ASTA"                        # = bridge.toml team_id

# ---- Missions: bt_runner_node runs the built-in tree a RunMission goal names ----
# (crusader_bt/behavior_trees/<name>.xml). The two gates are read once at start.
bt_runner_node:
  ros__parameters:
    publish_setpoints: false               # FALSE = this node CANNOT move the boat; legs
                                           # still poll for arrival, so a human can drive
                                           # and the tree follows. True is a G1 gate.
    fire_pump: false                       # FALSE = FireBurst runs DRY. Moving is G1,
                                           # water is G7.
    # The sticks for the MANUAL fire tree (StrafeKeep -> /crsd/rc_override), in the
    # order [ahead, lateral, yaw]: dp_hold's map and its measured neutrals. G1 row O9
    # checks each DIRECTION; flip one with stick_reverse.
    stick_channels: [3, 4, 1]              # throttle, lateral, steer
    stick_neutral_us: [1495, 1495, 1489]   # = RC3/RC4/RC1_TRIM
    stick_reverse: [false, false, false]
    # Task 3: the runner places every docking-bay sighting with this camera mounting.
    # It MUST equal target_tracker's (check_config): one camera placed twice is two
    # worlds that disagree about where things are.
    cam_x: 0.37
    cam_y: 0.0
    cam_yaw_deg: 0.0
    cam_pitch_deg: 0.0                     # + = aimed DOWN. Task 3 may need it negative:
                                           # level, from inside a slip the camera cannot
                                           # see the upper window
    dock_face_dz_m: 0.39                   # face centre above the camera (pitched camera
                                           # only): ~0.8 m above water, camera at 0.41 m
    # Obstacle avoidance (docs/nav2_avoidance_spec.md 5.8): NavigateTo and CircleBuoy plan
    # around every known hazard through Nav2's planner_server and hold when they cannot;
    # ArduPilot still flies the boat. Avoidance is not a safety system: the RC e-stop is.
    nav_mode: "off"                        # off = straight legs; shadow = plans and shows
                                           # the path, drives straight legs; on = drives
                                           # the planned path. The sim passes -p nav_mode:=
    # The planner knobs below are the tuned baseline the GCS planner profiles compare
    # against. They are live: a set applies at the next mission START.
    nav_hard_m: 0.8                         # "0.8 m hard": never closer than
                                            # this to a hazard's surface. At
                                            # most robot_radius*cos(pi/16)
                                            # (check_config)
    nav_soft_m: 2.0                         # "2 m soft" = inflation_radius
                                            # (check_config)
    nav_buoy_radius_m: 0.30                 # a RoboBuoy, circumscribed: its
                                            # footprint is 0.432 m square
    nav_track_radius_m: 0.30                # a LiDAR track no plan buoy claims
    nav_exempt_radius_m: 1.0                # a track this close to an exempt
                                            # buoy is that buoy, not a third
    nav_lookahead_m: 5.0                    # the carrot sits this far ahead
    nav_lookahead_min_m: 3.0                # ... and at least this far
    nav_max_chord_dev_m: 0.3                # the carrot's chord may cut the
                                            # path by this much, no more
    nav_wp_radius_m: 0.3                    # = the autopilot's WP_RADIUS
                                            # (check_config): an intermediate
                                            # carrot this close is reached
    nav_replan_period_s: 0.5                # plan at most this often
    nav_min_request_gap_s: 0.2              # ... and never faster than this
    nav_check_period_s: 0.1                 # is_path_valid at most this often
    nav_plan_timeout_s: 1.0                 # no answer by then = cannot plan
                                            # (Humble's planner hangs on a
                                            # non-current costmap)
    nav_first_plan_wait_s: 1.0              # no plan yet by then = hold
    nav_invalid_confirm: 2                  # is_path_valid must say invalid
                                            # this many times in a row
    nav_hysteresis_frac: 0.2                # a new path replaces a valid one
                                            # only if shorter by this fraction
    nav_hysteresis_m: 3.0                   # ... AND by this many metres
    nav_goal_replan_m: 1.0                  # a goal that moves this far
                                            # forces a replan
    nav_clip_radius_m: 35.0                 # goals are clipped to this radius
                                            # round the boat: inside the
                                            # costmap window (check_config)
    nav_clear_after_s: 5.0                  # blocked this long = clear the
                                            # costmap once and replan
    nav_unblock_reset_s: 3.0                # continuous FOLLOWING this long
                                            # resets the blocked clock
    nav_escape_margin_m: 0.5                # a start inside the hard zone
                                            # escapes to this much beyond it
    nav_goal_margin_m: 0.3                  # a goal inside the hard zone is
                                            # pushed out to this beyond it
    nav_local_check_tol_m: 0.1              # the BT's own checks use
                                            # hard - this, for quantisation
    nav_orbit_max_push_m: 3.0               # an orbit point near a hazard is
                                            # pushed out by at most this
    nav_orbit_clear_m: 1.4                  # ... until it is this clear. Also the
                                            # goal rule for every orbit hop as it
                                            # starts, ring[0] included (clearPoint)
    nav_orbit_radius_m: 6.0                 # ENTRY/EXIT orbit radius (CircleBuoy;
                                            # an XML radius= still wins). Tight
                                            # fields: ~2 (buoy 0.3 + hard 0.8 +
                                            # the hull's half-length, with room)
    nav_orbit_points: 8                     # ring points; more for a small radius
                                            # so a hop stays short and on the circle
    nav_orbit_tolerance_m: 2.0              # a ring hop counts as arrived within
                                            # this; keep it under the chord
                                            # (2 r sin(180/points)) or hops are skipped
    nav_gate_standoff_m: 6.0                # gate through point, metres past the
                                            # middle (the most; see nav_gate_min_*)
    nav_gate_approach_m: 8.0                # gate approach point, metres short of it
    nav_gate_clear_m: 1.5                   # THE GOAL RULE for gates: the straight
                                            # crossing and both gate points keep
                                            # this from every hazard's EDGE (a buoy
                                            # centre: + nav_buoy_radius_m)
    nav_gate_min_standoff_m: 3.5            # a crowded gate's through point may
                                            # back off from the tree's standoff
                                            # (6) to this; keep it > the through
                                            # leg's tolerance (2.5) or the boat
                                            # "arrives" before the gate line
    nav_gate_min_approach_m: 4.0            # ... and its approach point from 8 to
                                            # this, the room to line up
    nav_gate_margin_m: 1.8                  # then the crossing may move off-centre
                                            # in the gap, never closer than this
                                            # to either gate buoy
    nav_gate_step_m: 0.25                   # search pitch for both of the above
                                            # (the widest shift the margin allows
                                            # is always tried as well)
    nav_gate_tight_clear_m: 1.0             # nothing fits? the same search again
                                            # with this clearance (hard_m + 0.2;
                                            # the guard needs hard - tol = 0.7) ...
    nav_gate_tight_margin_m: 1.1            # ... and this from the gate buoys
                                            # (hard_m + buoy_radius_m). Tight is
                                            # better than sitting still
    nav_goal_max_move_m: 3.0                # the goal rule moves a goal at most
                                            # this far to clear it; nothing clear
                                            # that close -> the goal stays and the
                                            # leg's guard holds the boat
    nav_dock_finger_len_m: 2.0              # build guide: dock fingers
    nav_dock_finger_w_m: 0.5                # [RO]
    nav_dock_slip_w_m: 1.5                  # [RO]
    nav_dock_deck_depth_m: 1.0              # [RO]
    nav_fence_len_m: 10.0                   # SIDE FENCES, nav_mode on only: each
                                            # red/green in the passage plan gets a
                                            # wall of hazard circles this long,
                                            # OUTWARD from the buoy (gate: away
                                            # from the partner; single: red right
                                            # / green left of the axis), so the
                                            # planner passes it only on the
                                            # handbook's side. 0 = no fences
    nav_fence_spacing_m: 0.5                # circle pitch; < 2 x radius = a wall
    nav_fence_radius_m: 0.3                 # circle radius
    nav_fence_clear_m: 8.0                  # no circle this close to the ENTRY or
                                            # EXIT buoy: orbit radius 6 +
                                            # nav_orbit_clear_m 1.4 + radius 0.3

# ---- rfd_link_node: the RFD900 mesh to Ekko (crusader_link) ----
rfd_link_node:
  ros__parameters:
    rfd_endpoint: "/dev/crsd-rfd"          # the radio (udev); the sim uses udpin:127.0.0.1:14555
    uav_sysid: 200                         # Ekko's companion, which sends the TUNNELs
    source_system: 42                      # the boat on the mesh (not its autopilot)
