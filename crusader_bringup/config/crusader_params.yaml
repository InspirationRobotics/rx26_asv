# ============================================================================
# Crusader — SINGLE SOURCE OF TRUTH for all ROS-side parameters.
#
# Standard ROS 2 parameter-file format: pass to launch via
#     parameters=[os.path.join(pkg_share, "config", "crusader_params.yaml")]
# or per-node:  ros2 run ... --ros-args --params-file config/crusader_params.yaml
#
# Node code loads THIS file for its declaration defaults (api/common/config.py),
# so a code default can never drift from the file the launch system loads.
#
# Parameter posture (enforced in code via ParameterDescriptor):
#   [RO] read_only — safety/structural; `ros2 param set` is REJECTED; change
#        here + restart the node (rebuild NOT required, params load at start).
#   [DYN] dynamic — accepted at runtime via `ros2 param set`, range-validated.
#        Everything here is [RO]: the stack is safety plumbing, and nothing in
#        it is a test-day tuning knob.
#
# ---------------------------------------------------------------------------
# TWO HARD FORMAT RULES — rcl's parser is stricter than PyYAML. Break either and
# EVERY node in the launch dies at rclpy.init() with "Couldn't parse params
# file", before a single line of node code runs (this happened on the boat on
# 2026-07-29 and grounded the whole stack, LEDs included):
#
#   1. NO YAML anchors/aliases (&name / *name). rcl_yaml_param_parser rejects
#      them outright — it is a token-level parser, not a YAML document loader.
#      Values that MUST stay equal across sections are therefore written out
#      LITERALLY and pinned by tests/test_config_shared.py instead. If you
#      change one, change every copy the test names.
#   2. EVERY top-level key must be a node name whose only child is
#      `ros__parameters:`. A bare scalar at top level is what produced
#      "Cannot have a value before ros__parameters". That is why the `shared`
#      block below — which is documentation, not a real node — still carries a
#      `ros__parameters:` level: no node is named `shared`, so rcl parses the
#      section, matches it to nothing, and ignores it.
#
# tests/test_config_shared.py enforces both rules in CI. Do not "tidy" this file
# back into anchors.
# ============================================================================

# Canonical values for anything duplicated below. NOT a real node (see rule 2) —
# this section is the single source of truth by convention + test, and is never
# loaded by any running node.
shared:
  ros__parameters:
    # age at which a /crsd/pose sample stops being usable. telemetry_bridge uses
    # it to decide when to STOP republishing a dead MAVLink stream; any future
    # consumer must use the same number to decide when to stop acting on the
    # last pose it saw. One value because a consumer trusting a pose longer than
    # the bridge vouches for it is exactly the frozen-pose failure this guards
    # against.
    pose_timeout_s: 1.0

telemetry_bridge:
  ros__parameters:
    mav_endpoint: "udp:127.0.0.1:14551"   # [RO] MAVProxy rebroadcast, never serial
    drop_channel: 7                        # [RO] autonomy-drop RC channel (1..18)
    drop_threshold: 1700                   # [RO] us; crossing trips the latch
    drop_invert: false                     # [RO]
    rc_stale_timeout: 1.0                  # [RO] s without RC -> trip
    stream_timeout_s: 1.0                  # [RO] = shared.pose_timeout_s; s
                                           #      before a stale MAVLink stream
                                           #      stops being republished

# ---- LED status stack ----
led_node:
  ros__parameters:
    port: "/dev/crsd-led"                  # [RO] udev symlink (tools/udev), not by-id
    baud: 115200                           # [RO] must match firmware/LED.ino Serial.begin
    reconnect_s: 3.0                       # [RO] serial reconnect retry period [s]

pixhawk_led_status_node:
  ros__parameters:
    estop_channel: 7                       # [RO] SB e-stop switch channel (RC reference)
    estop_threshold: 1200                  # [RO] us; below = e-stopped (RC loss reads 0)
    autonomy_hold_s: 1.0                   # [RO] stay GREEN this long after last autonomy beat
    rate_hz: 5.0                           # [RO] LED state evaluation rate

# ---- Perception: the OAK-D nodes ----
# Both run in `asv`, which carries depthai for exactly this reason. They are not
# in core.launch.py: they contend for the one OAK-D, so which one runs is an
# operator choice, started by hand.
#
# The image geometry is not a preference: depth is aligned to the RGB camera and
# both are emitted at 1920x1200 / isp_denominator, so consumers may use the RGB
# intrinsics on the depth image and read depth at an RGB pixel. Changing
# isp_denominator changes every downstream pixel-space threshold.
oakd_publisher:
  ros__parameters:
    rgb_topic: "oak/rgb"                   # [RO] relative name; namespace/remap moves the pair
    depth_topic: "oak/depth"               # [RO] relative name; 16UC1 millimetres
    frame_id: "oak_rgb_camera_optical_frame"  # [RO] shared by both images (depth is aligned)
    fps: 30.0                              # [RO] camera frame rate [Hz]
    isp_denominator: 3                     # [RO] 1/N of 1920x1200; 3 -> 640x400 (stereo-native)
    poll_period_s: 0.01                    # [RO] output-queue poll; keep well under 1/fps
    queue_size: 4                          # [RO] device output queue depth (non-blocking)
    health_period_s: 5.0                   # [RO] warn if no frames arrived since last check

# buoy_detector OWNS THE SAME CAMERA as oakd_publisher — the OAK-D admits one
# client, so exactly one of the two runs at a time. It publishes detections, not
# frames: a few hundred bytes per frame instead of 1.28 MB, which is the point.
# The camera block below is duplicated from oakd_publisher and MUST stay equal to
# it (rcl forbids YAML anchors; tools/scripts/check_config.py pins the pair) —
# the two nodes have to produce identical geometry or a range measured under one
# does not mean the same thing under the other.
buoy_detector:
  ros__parameters:
    engine: "/root/robotx_ws/models/buoy_v16.engine"   # [RO] TensorRT engine
    labels:                                # [RO] IN ENGINE ORDER — a wrong order
                                           #      silently mislabels every buoy
      - "black_buoy"
      - "black_cross"
      - "black_target_boat"
      - "black_triangle"
      - "blue_buoy"
      - "green_buoy"
      - "green_light_buoy"
      - "green_pole_buoy"
      - "red_buoy"
      - "red_light_buoy"
      - "red_pole_buoy"
      - "yellow_buoy"
      - "yellow_target_boat"
    conf_min: 0.40                         # [RO] publish above this; consumers
                                           #      re-threshold for their own use
    imgsz_height: 352                      # [RO] engine input height
    imgsz_width: 640                       # [RO] engine input width
    range_min_m: 0.30                      # [RO] depth below this is invalid
    range_max_m: 25.0                      # [RO] depth above this is invalid
    min_depth_samples: 5                   # [RO] valid pixels needed to range a box
    frame_id: "camera_link"                # [RO] REP-103 body axes: x fwd, y left, z up
    detections_topic: "crsd/oak/detections"     # [RO] Detection3DArray, every frame
    publish_frames: false                  # [RO] BRING-UP ONLY: +38 MB/s at 30fps
    rgb_topic: "oak/rgb"                   # [RO] only used if publish_frames
    depth_topic: "oak/depth"               # [RO] only used if publish_frames
    fps: 30.0                              # [RO] = oakd_publisher.fps
    isp_denominator: 3                     # [RO] = oakd_publisher.isp_denominator
    poll_period_s: 0.01                    # [RO] output-queue poll period [s]
    queue_size: 4                          # [RO] device output queue depth
    health_period_s: 5.0                   # [RO] rate/health log period [s]
    stream_enable: true                    # [RO] annotated MJPEG view over HTTP;
                                           #      frames are only drawn while a
                                           #      browser is actually connected
    stream_port: 8080                      # [RO] same default as tools/oak_view.py —
                                           #      they cannot both bind it, and they
                                           #      are never both useful at once
    stream_quality: 60                     # [RO] JPEG quality for that view

# ---- lidar_cluster_node: MID360 point cloud -> 3D object clusters ----
# Consumes the livox container's /livox/lidar; opens no device itself. Not in
# core.launch.py — nothing here has run on the boat yet.
#
# THE EXTRINSIC IS BENCH-CONFIRMED, NOT ASSUMED (docs/G2_lidar_orientation.md,
# 2026-08-14). The raw Livox frame is x forward, y STARBOARD, z down — the plain
# 180-degree roll about the forward axis that mounting it upside down produces.
# Resources.md first described it as "y left, z down", which is left-handed and
# cannot describe a rigid sensor. Both signs therefore negate into REP-103, and
# both are [RO]: a live-tunable mounting geometry silently invalidates every
# position already on the map. Re-run G2 after any remount.
lidar_cluster_node:
  ros__parameters:
    cloud_topic: "/livox/lidar"            # [RO] livox container's PointCloud2
    clusters_topic: "crsd/lidar_clusters"  # [RO] Cluster3DArray, every window
    frame_id: "base_link"                  # [RO] REP-103: x fwd, y left, z up
    # -- extrinsic [RO]: sensor -> body. See docs/G2 --
    lidar_sign_y: -1.0                     # [RO] raw +y is starboard
    lidar_sign_z: -1.0                     # [RO] mounted upside down
    lidar_x: 0.32                          # [RO] m forward of geometry centre
    lidar_y: 0.05                          # [RO] m to PORT of centreline
    lidar_z: 0.52                          # [RO] m above the hull-bottom datum
    # -- self-return filters [DYN], applied in the SENSOR frame --
    r_min: 0.5                             # [DYN] clear sphere around the sensor;
                                           #       mount, cabling, deck beneath it
    fov_deg: 180.0                         # [DYN] forward sector only — the hull
                                           #       blocks the view aft of the beam,
                                           #       so returns behind it are the boat
    # -- levelled-frame gates [DYN] --
    water_z: 0.10                          # [DYN] PLACEHOLDER. Waterline above the
                                           #       hull datum; measure it floating
                                           #       (G2 step 4) and update. Most of
                                           #       this mount's FOV is water, so
                                           #       this threshold does real work.
    water_margin: 0.15                     # [DYN] keep points this far above water
    z_ceiling: 4.0                         # [DYN] above this is sky/rain
    r_max: 40.0                            # [DYN] horizontal range ceiling [m]
    # -- voxel-grid DBSCAN [DYN] --
    # eps stays SMALL and grows only gently with range. Opening it up for distant
    # objects is the wrong instinct: a buoy is 0.3 m wide at every range, so its
    # returns are always ~0.3 m apart, while the neighbourhood volume grows as
    # eps^3 and sweeps in proportionally more scattered noise.
    leaf_size: 0.15                        # [DYN] voxel edge [m]
    eps_0: 0.30                            # [DYN] neighbourhood radius at eps_r_ref
    eps_r_ref: 15.0                        # [DYN] range where eps_0 applies [m]
    max_rings: 2                           # [DYN] cap on adaptive eps, in voxels
    min_density_points: 6                  # [DYN] raw points in the neighbourhood
                                           #       before a voxel may seed a cluster
    min_points: 5                          # [DYN] points needed to emit a cluster
    max_extent_m: 8.0                      # [DYN] bigger = shoreline, not an object
    # -- accumulation + freshness [DYN] --
    # A 0.3 m buoy returns ~37 points per sweep at 5 m, 9 at 10 m, 2 at 20 m.
    # Measured against this core: 1 sweep reaches ~10 m, 5 sweeps reach ~20 m.
    # Livox's non-repetitive pattern means each sweep adds NEW coverage rather
    # than resampling the same lines, which is what makes stacking them work.
    accumulate_sweeps: 5                   # [DYN] 10 Hz sweeps -> ~0.5 s window
    attitude_timeout_s: 1.0                # [DYN] stale -> cluster unlevelled
    pose_timeout_s: 1.0                    # [DYN] stale -> single sweep, no
                                           #       accumulation (cannot compensate)
    health_period_s: 5.0                   # [DYN] JSON stats publish period

# ---- World model: target_tracker — detections + pose -> earth-anchored targets ----
# Consumes oak/detections (camera_link), crsd/lidar_clusters (base_link),
# /crsd/pose and /crsd/attitude; publishes crsd/world_targets. Opens no device
# and commands nothing. Not in core.launch.py — nothing here has run on the boat.
#
# THE CAMERA EXTRINSIC BELOW IS MEASURED, THE ORIENTATION IS NOT BENCH-CONFIRMED.
# Both come from Resources.md's mounting section. The TRANSLATION (37 cm forward,
# on the centreline, 65 cm up) is measured against the same hull-bottom datum as
# the LiDAR's lidar_x/y/z, which is what lets a camera z and a LiDAR z of the
# same buoy agree. The ORIENTATION is Resources.md's "already REP-103; NOT yet
# bench-confirmed the way the LiDAR was" — so the two mount ANGLES are zero
# because the camera is believed to point dead ahead and dead level, not because
# anyone has proved it. That belief is exactly what got the LiDAR's y-sign wrong
# for a season until docs/G2 settled it on the bench; run the same check here and
# the angles stop being an assumption. It is [RO] for the LiDAR's reason —
# retuning the mounting geometry live silently invalidates every target already
# on the map.
target_tracker:
  ros__parameters:
    detections_topic: "crsd/oak/detections"     # [RO] = buoy_detector.detections_topic
    clusters_topic: "crsd/lidar_clusters"  # [RO] = lidar_cluster_node.clusters_topic
    targets_topic: "crsd/world_targets"    # [RO] TrackedTargetArray, every tick
    health_topic: "crsd/world_model_health"  # [RO] std_msgs/String (JSON)
    update_rate_hz: 10.0                   # [RO] fuse/track cycle. Slower than
                                           #      the camera ON PURPOSE: one
                                           #      message counts once, and three
                                           #      frames 33 ms apart are the same
                                           #      vantage point.
    # -- freshness budgets [RO] --
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s; stale
                                           #      -> NO observations ingested
    attitude_timeout_s: 1.0                # [RO] stale -> no observations; a
                                           #      detection cannot be placed
                                           #      without roll/pitch/yaw
    detection_timeout_s: 1.0               # [RO] stale -> LiDAR-only cycles
    cluster_timeout_s: 2.0                 # [RO] stale -> camera-only cycles.
                                           #      Longer than the others: the
                                           #      LiDAR window is ~0.5 s, so a
                                           #      1 s budget would flap.
    # -- camera extrinsic [RO]: camera_link -> base_link. Resources.md, see above --
    cam_x: 0.37                            # [RO] m forward of the body origin
                                           #      (LiDAR is at 0.32 — 5 cm aft)
    cam_y: 0.0                             # [RO] m to PORT; camera is on the
                                           #      centreline, LiDAR is 5 cm port
    cam_z: 0.65                            # [RO] m above the hull-bottom datum,
                                           #      the SAME datum as lidar_z=0.52
    cam_yaw_deg: 0.0                       # [RO] mount yaw, + = aimed to PORT.
                                           #      ASSUMED, not bench-confirmed.
    cam_pitch_deg: 0.0                     # [RO] mount tilt, + = aimed DOWN.
                                           #      ASSUMED, not bench-confirmed.
    # -- fusion gates [DYN] --
    fuse_bearing_deg: 6.0                  # [DYN] camera/LiDAR bearing agreement.
                                           #       Stays wide for the mount
                                           #       ANGLES, which are assumed, not
                                           #       measured. The translations no
                                           #       longer justify it: the two
                                           #       sensors are 5 cm apart in x and
                                           #       y, which is 0.3 deg of parallax
                                           #       at 10 m. Tighten toward 2-3 deg
                                           #       once a G2-style bench check
                                           #       confirms the camera points
                                           #       where this file says it does.
    fuse_range_m: 4.0                      # [DYN] absolute range-agreement floor
    fuse_range_frac: 0.25                  # [DYN] ... or this fraction of the
                                           #       camera range, whichever is
                                           #       larger — stereo error grows
                                           #       with range, so the gate must
    min_confidence: 0.50                   # [DYN] above buoy_detector's 0.40:
                                           #       the detector publishes what it
                                           #       saw, the map commits to it
    track_unlabeled: true                  # [RO] keep LiDAR-only clusters. An
                                           #      unnamed obstacle is still an
                                           #      obstacle (package README).
    # -- tracking gates [DYN] --
    assoc_radius_m: 3.0                    # [DYN] world-frame association radius.
                                           #       The single most consequential
                                           #       number here: too wide merges a
                                           #       red/green gate pair into one
                                           #       object at the midpoint, too
                                           #       narrow splits one buoy into a
                                           #       new track every few seconds.
                                           #       Watch position_stddev.
    pos_alpha: 0.30                        # [DYN] floor on the position EMA gain
    vel_alpha: 0.20                        # [DYN] velocity EMA gain
    confirm_hits: 3                        # [DYN] sightings before CONFIRMED
    tentative_timeout_s: 3.0               # [DYN] unconfirmed tracks expire fast
                                           #       — one frame of detector noise
                                           #       must not sit on the map
    track_timeout_s: 0.0                   # [DYN] 0 = a CONFIRMED track NEVER
                                           #       expires: the boat remembers
                                           #       the whole course for the run,
                                           #       so a buoy re-entering the FOV
                                           #       updates the ORIGINAL track
                                           #       rather than spawning a second
                                           #       one beside it. Set a positive
                                           #       number of seconds to go back
                                           #       to forgetting.
                                           #       WITH THIS AT 0, confirm_hits
                                           #       is the ONLY thing between a
                                           #       wave crest and a permanent
                                           #       phantom — raise it if
                                           #       phantoms accumulate.
    max_tracks: 64                         # [DYN] runaway guard, not a normal
                                           #       path (a shoreline clustering
                                           #       into hundreds of objects)
    health_period_s: 5.0                   # [DYN] JSON stats publish period

# ---- Ground station: the operator's window onto the whole boat ----
# Read-only over ROS: four subscriptions, no publishers. Its only outward
# effects are the node processes it spawns and the two power verbs it can hand
# to the HOST helper (tools/scripts/crsd_power_helper.py). Both are gated in
# the page AND re-checked server-side, because a rule enforced only in
# JavaScript is decoration.
#
# Replaces crusader_world_model's map_server, which is now this node's map tab.
ground_station:
  ros__parameters:
    port: 8090                             # [RO] clear of the viewers it embeds:
                                           #      8080 = buoy_detector/oak_view,
                                           #      8081 = lidar_view
    bind_host: "0.0.0.0"                   # [RO] must NOT be 127.0.0.1 or the
                                           #      laptop cannot reach it
    targets_topic: "crsd/world_targets"    # [RO] = target_tracker.targets_topic
    tools_dir: "/root/robotx_ws/src/rx26_asv/tools"   # [RO] where the viewer
                                           #      scripts live INSIDE the asv
                                           #      container. Wrong path = the
                                           #      viewer tabs fail to start with
                                           #      a file-not-found, nothing else.
    power_socket: "/run/crsd-power.sock"   # [RO] host helper socket, bind-mounted
                                           #      into this container. A container
                                           #      CANNOT power off the Jetson on
                                           #      its own; see crsd_power_helper.
    allow_power: true                      # [RO] master switch for the power tab.
                                           #      Set false on any machine where
                                           #      a browser must never be able to
                                           #      halt the host.
    disk_path: "/"                         # [RO] filesystem reported as free.
                                           #      Inside a container this is the
                                           #      CONTAINER's view, so the tab
                                           #      prints the path it measured.
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s
    attitude_timeout_s: 1.0                # [RO] stale -> attitude readout greys
    status_timeout_s: 1.0                  # [RO] mode/armed readout. ALSO the
                                           #      power interlock: unknown armed
                                           #      state locks power, because a
                                           #      missing FcuStatus usually means
                                           #      the bridge is down, which is not
                                           #      evidence the boat is safe.
    targets_timeout_s: 3.0                 # [RO] stale -> map says so
    poll_period_s: 0.2                     # [RO] browser -> /state. 5 Hz is
                                           #      ~0.5 Mbps with a full trail
    graph_period_s: 1.0                    # [DYN] how often the ROS node graph is
                                           #       scanned. Once per browser poll
                                           #       per client would put discovery
                                           #       traffic on the wire in
                                           #       proportion to viewers.
    trail_length: 600                      # [DYN] wake points kept
    trail_min_move_m: 0.5                  # [DYN] distance-gated, not time-gated
    log_capacity: 1500                     # [RO] /rosout lines kept in the ring.
                                           #      Bounded because a node in a
                                           #      failure loop emits thousands a
                                           #      minute, and running the Jetson
                                           #      out of memory during exactly
                                           #      that failure helps nobody.
    record_dir: "/root/robotx_ws/logs/sessions"   # [RO] session root. Put it on
                                           #      a BIND MOUNT if you want the
                                           #      recordings to survive the
                                           #      container being recreated.
    record_telemetry_hz: 2.0               # [DYN] telemetry.jsonl sample rate
    record_frame_hz: 1.0                   # [DYN] frames saved per second PER
                                           #       viewer, pulled from the MJPEG
                                           #       servers rather than re-encoded
    record_min_free_gb: 2.0                # [DYN] refuse to start, and stop
                                           #       mid-run, below this. A full
                                           #       root filesystem takes down the
                                           #       whole stack, not just the
                                           #       recording.

# ---- rc_heartbeat_watchdog: force-disarm on RC-transmitter link loss (safety) ----
# Consumes telemetry_bridge topics (/crsd/rc_channels, /crsd/fcu_status) and routes
# a force-disarm back through the bridge (/crsd/force_disarm) — no own MAVLink conn.
# Complements ArduPilot FS_THR/FS_GCS and the hardware SB e-stop (defense in depth).
# All params [RO]: safety config, change here + restart. rc_channel/reset_channel
# share ch7 (the SB switch) with telemetry_bridge/pixhawk_led as read-only inputs.
rc_heartbeat_watchdog:
  ros__parameters:
    heartbeat_timeout: 1.0                 # [RO] s of stale monitored-channel PWM -> RC link lost
    rc_channel: 7                          # [RO] channel whose valid PWM is the RC heartbeat
    min_valid_pwm: 900                     # [RO] us; below = no pulses (RC loss reads 0)
    require_armed: true                    # [RO] only force-disarm when armed
    link_timeout: 3.0                      # [RO] s without any bridge topic -> gateway deemed down
    enable_latch: false                    # [RO] true = hold kill until RC reset toggle clears it
    reset_channel: 7                       # [RO] channel whose low->high toggle clears the latch
    reset_low_pwm: 1300                    # [RO] us; reset switch "low" below this
    reset_high_pwm: 1700                   # [RO] us; reset switch "high" above this

# ---- ocs_client: the heartbeat to the Operator Control Station ----
# NOT PROVEN ON THE BOAT — started by hand, absent from core.launch.py, same
# posture as ground_station. Sends an RxReport heartbeat as length-prefixed JSON
# over one TCP connection that also carries OCS commands back down. Commands are
# republished to /crsd/ocs_command and NEVER acted on here: the RC e-stop remains
# the only safety path.
# All [RO]: none of this is a test-day tuning knob, and ocs_host in particular
# must not be changeable from a laptop mid-run.
ocs_client:
  ros__parameters:
    ocs_host: "192.168.8.107"               # [RO] the OCS on the TEAM subnet.
                                           #      There is NO discovery: give the
                                           #      OCS a static address on its team
                                           #      NIC or a DHCP reservation, and
                                           #      set this to match.
                                           #      NOT 127.0.0.1 — that is this
                                           #      Jetson, and the connect fails.
    ocs_port: 37564                        # [RO] = [tcp] port in the OCS
                                           #      bridge.toml. Clear of 8090
                                           #      (ground_station) and 8080/8081
                                           #      (the viewers it embeds).
    vehicle_id: "USV1"                     # [RO] MUST match a [[vehicle]] id in
                                           #      the OCS bridge.toml, or the OCS
                                           #      drops every frame with
                                           #      "not a configured vehicle"
    team_id: "ASTA"                        # [RO] = bridge.toml team_id
    rate_hz: 2.0                           # [RO] the handbook mandates 2 Hz per
                                           #      active vehicle; the OCS rate
                                           #      governor reserves budget for it
    fake_telemetry: false                  # [RO] true = invent a circle instead
                                           #      of subscribing, for bench work
                                           #      with no Pixhawk. Logs a warning
                                           #      the whole time it is on. NEVER
                                           #      leave true for a scored run.
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s; stale
                                           #      -> no heartbeat at all, rather
                                           #      than a fabricated position
    attitude_timeout_s: 1.0                # [RO] stale -> roll/pitch omitted, the
                                           #      rest of the heartbeat still goes
    status_timeout_s: 1.0                  # [RO] stale -> no heartbeat: without
                                           #      armed/mode the vehicle state is
                                           #      unknowable, and STATE_UNKNOWN is
                                           #      refused by the OCS validator


# ---- oak_detector: two-stage shape + LED-colour pipeline ----
# THIRD client for the one OAK-D, alongside oakd_publisher and buoy_detector.
# Only one of the three may run; which one is an operator choice per session,
# which is why none of them is in core.launch.py.
#
# It publishes to the SAME topic as buoy_detector (oak/detections) on purpose:
# the two answer the same question about different mission elements, they can
# never run together, and target_tracker should work behind whichever is up
# without a remap. check_config.py pins all three names together.
#
# It also shares buoy_detector's stream_port 8080 on purpose — same reason, plus
# the ground station's camera tab then finds whichever is running.
#
# THE CROP PARAMS ARE A CONTRACT WITH THE TRAINING EXPORTER, not tuning knobs.
# cls_imgsz / crop_pad / crop_top_frac decide the picture the classifier sees,
# and the exporter that built its training set cuts crops the same way. A few
# percent of disagreement does not fail — the engine just classifies worse,
# everywhere, and nothing reports why. Change them in both places or not at all.
#
# That contract has now broken twice, both times silently:
#   * a val folder holding crops from two exporter versions graded 0.97 in
#     training and 0.55 against freshly cut crops — the gap was entirely
#     geometry, not the model.
#   * led_patch cut a full-width top band while the exporter cut buoylib's
#     led_box (27% buoy vs 69% buoy), so a classifier at 98.6% on held-out crops
#     underperformed on the water.
# ae_compensation belongs to the same contract for the same reason: it decides
# what colour the LED records as.
oak_detector:
  ros__parameters:
    # -- stage 1: buoy detector --
    det_engine: "/root/robotx_ws/models/buoy_detector.engine"   # [RO] TensorRT
    # -- stage 1b: shape, measured rather than predicted --
    # 'geometry' measures the marking's OUTLINE on the full-resolution crop
    # (shape_core.marking_shape: 4th harmonic of r(theta) after whitening, plus
    # the bounding-box fill ratio; the two must agree or it abstains). CPU, no
    # model, no training set.
    #
    # This is what lets det_engine be a SINGLE-CLASS "buoy" detector. At 15 m a
    # marking is a couple of feature-map cells across and the detector head is
    # guessing; the ISP crop of that same buoy is 60-200 px and the outline is
    # right there. Measured on synthetic buoys across 0-66 deg of yaw: 8/8,
    # where a raw (un-whitened) 4th harmonic confuses the two classes past
    # 66 deg.
    #
    # Abstentions fall back to the detector's own class, so 'detector' is always
    # a safe thing to switch back to.
    shape_source: "geometry"               # [RO] "geometry" | "detector"
    shape_min_radius: 6.0                  # [RO] marking radius [px] below
                                           #      which it refuses. Synthetic
                                           #      renders are unreliable under
                                           #      ~6 px and solid by ~10 —
                                           #      raise this to abstain more
    shape_min_share: 0.6                   # [RO] share of a track's weighted
                                           #      shape votes one answer needs.
                                           #      Abstentions are never votes
    det_labels:                            # [RO] IN ENGINE ORDER — check the
      - "circle"                           #      dataset.yaml the engine was
      - "diamond"                          #      trained from, not this comment
    det_conf_min: 0.60                     # [RO] minimum detector confidence
    det_imgsz_height: 640                  # [RO] detector engine input height
    det_imgsz_width: 640                   # [RO] detector engine input width
    # -- stage 4: LED colour classifier --
    cls_engine: "/root/robotx_ws/models/led_classifier.engine"  # [RO] TensorRT
    cls_labels:                            # [RO] IN ENGINE ORDER. For an
      - "blue"                             #      ultralytics classifier that is
      - "green"                            #      the training FOLDER order,
      - "off"                              #      i.e. alphabetical — not the
      - "red"                              #      order you find natural
    cls_imgsz: 64                          # [RO] = exporter --crop-size AND the
                                           #      imgsz the engine was exported
                                           #      at. 64, not 96: the LED crop is
                                           #      ~87x48 px on real footage, so
                                           #      96 was upsampling, and
                                           #      4_export.py's default moved
    crop_pad: 0.10                         # [RO] = exporter's 1.2x box padding
    crop_top_frac: 0.25                    # [RO] = exporter --crop-frac. NOTE
                                           #      the meaning changed with
                                           #      led_patch: it is the fraction
                                           #      of the BUOY kept below the LED
                                           #      (buoylib LED_FRAC), not the
                                           #      fraction of the crop taken off
                                           #      the top. 0.40 with the new
                                           #      led_patch is a band far taller
                                           #      than the exporter's
    iou_match: 0.25                        # [RO] IoU to continue a track
    max_missed: 10                         # [RO] frames a track survives unseen.
                                           #      Losing a track resets its flash
                                           #      window, so this is now worth
                                           #      more than it looks
    # -- stage 4: colour vote. BYPASSED while flash_enable is true --
    # Set flash_enable false with vote_decay 0.0 and vote_min 0.0 to see the RAW
    # per-frame classification, unsmoothed — the view you want when judging the
    # model itself rather than the tracker.
    vote_decay: 0.85                       # [RO] per-frame forgetting factor
    vote_min: 0.55                         # [RO] share needed to publish
    # -- stage 5: flash detection --
    # RobotX 2026 Task 1: ten buoys, five light states (OFF, flashing RED /
    # GREEN / BLUE, solid BLUE), flashing at 1 s ON / 1 s OFF. Task 2 adds SOLID
    # red and green survey indicators. Flashing blue is the ENTRY buoy and solid
    # blue the EXIT, so flashing-vs-solid is a course-direction decision, not a
    # cosmetic label.
    #
    # THE GAPS BETWEEN THESE FOUR NUMBERS ARE DELIBERATE. Between off_max and
    # flash_lo, and between flash_hi and solid_min, the answer is `unknown` and
    # the label degrades to the bare colour. Reading a solid-blue EXIT as a
    # flashing-blue ENTRY sends the boat to the wrong end of the course, so
    # refusing to answer is much cheaper than answering wrongly.
    #
    # The values come from tools/bench/bench_flash.py, not from taste. A
    # confident classifier reports ~0.9 for a lit frame rather than 1.0, so a
    # SOLID light measures ~0.90 duty before any noise; solid_min at 0.85 would
    # make a solid buoy unclassifiable the moment the model is wrong one frame
    # in ten. These survive 10% frame error and abstain at 25%.
    flash_enable: true                     # [RO] false -> colour only, via voter
    flash_window_s: 6.0                    # [RO] duty window; 3 full periods
    flash_min_span_s: 4.0                  # [RO] observed time before a verdict
    flash_min_samples: 8                   # [RO] frames before a verdict
    solid_min: 0.70                        # [RO] at/above this = solid
    off_max: 0.30                          # [RO] at/below this = off
    colour_min_share: 0.6                  # [RO] share of LIT frames one colour
                                           #      needs before it is named
    # -- how "flashing" is actually decided --
    # NOT by duty cycle alone, and that is the point. A 1 s ON / 1 s OFF light
    # averages 0.5. A classifier hedging at 0.5 on every frame also averages
    # 0.5. Duty cannot separate them, and hedging is precisely how this
    # classifier fails — on a held-out session its `off` class scored 27% recall
    # at 65% precision.
    #
    # So the tracker asks whether the signal MOVES LIKE A LIGHT: how strongly
    # the lit score anti-correlates with itself half a period earlier. A square
    # wave scores ~1.0 there; noise scores ~0. That test is SCALE-FREE, so a
    # barely-visible green flash swinging 0.52 to 0.47 passes exactly as well as
    # a bright red one swinging 1.0 to 0.0 — which matters, because green's
    # whole margin over an unlit hull is +6 saturation points.
    #
    # Measured against 14 synthetic cases including 25% frame error, hedging at
    # four noise levels, a slow drift and a wrong-period blink: 14/14.
    flash_period_s: 2.0                    # [RO] FULL cycle [s]. Task 1 is
                                           #      1 s ON / 1 s OFF = 2.0
    flash_corr_min: 0.45                   # [RO] anti-correlation at half a
                                           #      period needed to call it
                                           #      flashing
    flash_debug_path: ""                   # [RO] jsonl of every observation, for
                                           #      replaying real footage through
                                           #      the tracker off-boat. Empty =
                                           #      off; it writes one line per
                                           #      detection per frame
    # -- ranging --
    range_min_m: 0.30                      # [RO] depth below this is invalid
    range_max_m: 25.0                      # [RO] depth above this is invalid
    min_depth_samples: 5                   # [RO] valid pixels needed to range
    # -- output --
    frame_id: "camera_link"                # [RO] REP-103: x fwd, y left, z up
    detections_topic: "crsd/oak/detections"     # [RO] = buoy_detector.detections_topic
    health_topic: "crsd/oak_detector_health"   # [RO] std_msgs/String JSON;
                                           #      per-track light state, and the
                                           #      rate the flash tracker depends
                                           #      on. Same shape as
                                           #      crsd/lidar_cluster_health
    # -- camera: fps and isp_denominator MUST equal the other OAK-D nodes.
    # subpixel / lr_check / sync_threshold_ms used to live here too and are now
    # constants in oak_pipeline.py — equal by construction, nothing to pin.
    fps: 30.0                              # [RO] = oakd_publisher.fps
    isp_denominator: 3                     # [RO] 3 -> 640x400. Raise resolution
                                           #      (2 -> 960x600) if no_crop is
                                           #      high — moves all three nodes
    ae_compensation: -3                    # [RO] EV steps, -9..9; negative is
                                           #      darker. A TRAINING CONTRACT:
                                           #      must match the exposure the
                                           #      classifier's footage was shot
                                           #      at. oak_record.py also
                                           #      defaults to -3. 0 = off
    poll_period_s: 0.01                    # [RO] output-queue poll period [s]
    queue_size: 4                          # [RO] device output queue depth
    health_period_s: 5.0                   # [RO] rate/health log period [s]
    # -- annotated view --
    stream_enable: true                    # [RO] MJPEG over HTTP; frames drawn
                                           #      only while a browser is open
    stream_port: 8080                      # [RO] SHARED with buoy_detector and
                                           #      tools/oak_view.py — all three
                                           #      contend for the one camera, so
                                           #      never for the socket
    stream_quality: 60                     # [RO] JPEG quality for that view